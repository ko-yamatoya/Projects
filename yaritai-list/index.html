<!DOCTYPE html>
<html lang="ja" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>やりたいことリスト</title>
<meta name="description" content="やりたいことを書き留めて、区分けして、進み具合を記録する。">
<meta name="theme-color" content="#f7f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="やりたい">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* ============================================================
   tokens
   light/dark は「自動（OS）」「ライト」「ダーク」の3値。
   data-theme=auto のときだけ prefers-color-scheme に従う。
   ============================================================ */
:root{
  color-scheme: light;
  --plane:#f7f5f1; --surface:#fdfcfa; --surface-2:#f2efe9; --surface-3:#eae6de;
  --ink:#1a1916; --ink-2:#52514e; --muted:#6e6b64;
  --hair:#e3dfd6; --hair-strong:#d3cec2;
  --grid:#e6e3dc; --axis:#c9c5bc;
  --on-ink:#fbfaf7;
  --focus:#2a78d6;
  /* data colors — dataviz skill の既定パレット（自前サーフェスで再検証済み） */
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s-neutral:#7a7872;
  --good:#0ca30c; --critical:#d03b3b; --star:#c98500;
  --shadow:0 1px 2px rgba(26,25,22,.05), 0 8px 24px -12px rgba(26,25,22,.18);
  --sheet-shadow:0 -1px 0 var(--hair), 0 -20px 60px -20px rgba(26,25,22,.35);
  --r:14px; --r-sm:9px;
  --sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;
  --serif:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --plane:#121211; --surface:#1b1b1a; --surface-2:#232321; --surface-3:#2c2c29;
    --ink:#f5f3ee; --ink-2:#c3c2b7; --muted:#9a978d;
    --hair:#33332f; --hair-strong:#45443f;
    --grid:#2c2c2a; --axis:#383835;
    --on-ink:#16150f;
    --focus:#7fb0f0;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s-neutral:#898781; --star:#eda100;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    --sheet-shadow:0 -1px 0 var(--hair), 0 -20px 60px -20px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#121211; --surface:#1b1b1a; --surface-2:#232321; --surface-3:#2c2c29;
  --ink:#f5f3ee; --ink-2:#c3c2b7; --muted:#9a978d;
  --hair:#33332f; --hair-strong:#45443f;
  --grid:#2c2c2a; --axis:#383835;
  --on-ink:#16150f;
  --focus:#7fb0f0;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s-neutral:#898781; --star:#eda100;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --sheet-shadow:0 -1px 0 var(--hair), 0 -20px 60px -20px rgba(0,0,0,.7);
}

/* ============================================================ base */
*{box-sizing:border-box}
[hidden]{display:none !important}   /* display を指定した要素でも hidden が必ず効くように */
html,body{margin:0;padding:0}
body{
  background:var(--plane); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
  overflow-x:hidden;
}
h1,h2,h3{margin:0; font-weight:600; letter-spacing:.01em}
button,input,select,textarea{font:inherit; color:inherit}
button{background:none; border:0; padding:0; cursor:pointer; -webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:4px}
.sr{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0}
.wrap{max-width:780px; margin:0 auto; padding:0 16px}
.mono{font-variant-numeric:tabular-nums}

/* ============================================================ header */
header.top{
  position:sticky; top:0; z-index:40;
  background:color-mix(in srgb, var(--plane) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(12px);
  border-bottom:1px solid var(--hair);
  padding-top:env(safe-area-inset-top);
}
.top-in{display:flex; align-items:center; gap:10px; min-height:52px}
.brand{display:inline-flex; align-items:center; gap:9px; font-size:14.5px; font-weight:600;
  letter-spacing:.09em; white-space:nowrap}
.brand i{width:7px; height:7px; border-radius:50%; background:var(--s1); flex:none;
  box-shadow:0 0 0 3px color-mix(in srgb, var(--s1) 16%, transparent)}
.top-sp{flex:1}
.iconbtn{
  width:36px; height:36px; display:grid; place-items:center;
  border-radius:50%; color:var(--ink-2);
}
.iconbtn:hover{background:var(--surface-2); color:var(--ink)}
.iconbtn svg{width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.pubflag{
  font-size:11.5px; letter-spacing:.08em; color:var(--muted);
  border:1px solid var(--hair-strong); border-radius:999px; padding:2px 9px;
}
body:not([data-pub="1"]) .pubflag{display:none}

/* ============================================================ nav */
nav.tabs{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  display:flex; background:color-mix(in srgb, var(--plane) 92%, transparent);
  backdrop-filter:saturate(1.4) blur(12px);
  border-top:1px solid var(--hair);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:9px 2px 8px; color:var(--muted); font-size:10.5px; letter-spacing:.04em;
}
nav.tabs svg{width:21px; height:21px; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] svg{stroke-width:1.9}
@media (min-width:720px){
  body{padding-bottom:40px}
  nav.tabs{
    position:static; border-top:0; border-bottom:1px solid var(--hair);
    max-width:780px; margin:0 auto; padding:0 8px; background:transparent; backdrop-filter:none;
  }
  nav.tabs button{flex-direction:row; gap:7px; font-size:13px; padding:10px 14px; border-bottom:2px solid transparent; margin-bottom:-1px}
  nav.tabs button[aria-current="page"]{border-bottom-color:var(--ink)}
  nav.tabs svg{width:17px; height:17px}
}

/* ============================================================ page & cards */
main{padding:18px 0 28px}
.view[hidden]{display:none}
.vhead{margin:2px 0 14px}
.vhead h2{font-family:var(--serif); font-size:23px; font-weight:400; letter-spacing:.04em}
.vhead p{margin:4px 0 0; color:var(--muted); font-size:12.5px}
.card{
  background:var(--surface); border:1px solid var(--hair); border-radius:var(--r);
  box-shadow:var(--shadow);
}
.pad{padding:16px}
.hr{height:1px; background:var(--hair); border:0; margin:0}

/* ============================================================ controls */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  min-height:40px; padding:0 15px; border-radius:var(--r-sm);
  border:1px solid var(--hair-strong); background:var(--surface);
  font-size:14px; transition:background .12s, border-color .12s;
}
.btn:hover{background:var(--surface-2)}
.btn svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.btn.primary{background:var(--ink); color:var(--on-ink); border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn.ghost{border-color:transparent; background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--critical); border-color:color-mix(in srgb, var(--critical) 35%, var(--hair))}
.btn.sm{min-height:32px; padding:0 11px; font-size:13px}
.btn[disabled]{opacity:.45; cursor:default}
input[type=text], input[type=search], input[type=date], textarea, select{
  width:100%; background:var(--surface); border:1px solid var(--hair-strong);
  border-radius:var(--r-sm); padding:9px 11px; min-height:40px;
}
textarea{min-height:76px; resize:vertical; line-height:1.55}
label.fl{display:block; font-size:12px; letter-spacing:.04em; color:var(--muted); margin:0 0 5px}
.field{margin:0 0 14px}
.seg{display:flex; gap:6px; flex-wrap:wrap}
.seg button{
  border:1px solid var(--hair-strong); border-radius:999px; padding:6px 13px;
  font-size:13px; background:var(--surface); color:var(--ink-2); min-height:34px;
}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--on-ink); border-color:var(--ink)}
.chiprow{display:flex; gap:8px; overflow-x:auto; padding:2px 16px 2px; scrollbar-width:none; -webkit-overflow-scrolling:touch}
.chiprow::-webkit-scrollbar{display:none}

/* money chips ------------------------------------------------
   識別は「色つきドット＋文字」。文字は常にテキストトークン（色で意味を運ばない） */
.chip{
  display:inline-flex; align-items:center; gap:6px; flex:none;
  font-size:12px; line-height:1; padding:5px 10px; border-radius:999px;
  border:1px solid var(--hair); background:var(--surface-2); color:var(--ink-2); white-space:nowrap;
}
.chip .dot{width:8px; height:8px; border-radius:50%; background:var(--s-neutral); flex:none}
.chip.m-pay   .dot{background:var(--s1)} .chip.m-pay  {background:color-mix(in srgb, var(--s1) 11%, var(--surface)); border-color:color-mix(in srgb, var(--s1) 26%, var(--hair))}
.chip.m-hold  .dot{background:var(--s2)} .chip.m-hold {background:color-mix(in srgb, var(--s2) 11%, var(--surface)); border-color:color-mix(in srgb, var(--s2) 26%, var(--hair))}
.chip.m-none  .dot{background:var(--s3)} .chip.m-none {background:color-mix(in srgb, var(--s3) 11%, var(--surface)); border-color:color-mix(in srgb, var(--s3) 26%, var(--hair))}
.chip.m-null{border-style:dashed; background:transparent; color:var(--muted)}
.chip.m-null .dot{background:transparent; border:1.5px dashed var(--s-neutral); width:9px; height:9px}
.chip.cat{background:transparent; border-color:var(--hair-strong); color:var(--ink-2)}
.chip.cat.tint{color:var(--ink-2)}
body[data-pub="1"] .sens{display:none !important}

/* ============================================================ toast */
#toast{
  position:fixed; left:50%; transform:translateX(-50%) translateY(140%);
  bottom:calc(72px + env(safe-area-inset-bottom)); z-index:60;
  display:flex; align-items:center; gap:12px;
  background:var(--ink); color:var(--on-ink); border-radius:999px;
  padding:9px 10px 9px 18px; box-shadow:var(--shadow); font-size:13.5px;
  transition:transform .26s cubic-bezier(.2,.9,.2,1); max-width:calc(100vw - 32px);
}
#toast.on{transform:translateX(-50%) translateY(0)}
#toast button{border:1px solid color-mix(in srgb, var(--on-ink) 40%, transparent); border-radius:999px; padding:4px 12px; font-size:12.5px; color:inherit}
@media (min-width:720px){#toast{bottom:24px}}

/* ============================================================ quick add */
.qadd{display:flex; gap:8px; align-items:center; margin:0 0 14px}
.qadd input{
  background:var(--surface); border:1px solid var(--hair-strong); border-radius:999px;
  padding:11px 17px; min-height:46px; box-shadow:var(--shadow);
}
.qadd input::placeholder{color:var(--muted)}
.qadd .btn{min-height:46px; border-radius:999px; flex:none; width:46px; padding:0}
.qadd .btn svg{width:19px; height:19px}

/* ============================================================ filters */
.filters{display:flex; flex-direction:column; gap:9px; margin:0 0 6px}
.filters .row1{display:flex; gap:8px; align-items:center}
.filters input[type=search]{flex:1 1 auto; min-width:0}
#f-more{display:flex; flex-direction:column; gap:12px; padding:12px 13px; margin-top:2px;
  background:var(--surface); border:1px solid var(--hair); border-radius:var(--r); box-shadow:var(--shadow)}
.fgrp{display:flex; flex-direction:column; gap:7px}
.fl2{font-size:11px; letter-spacing:.08em; color:var(--muted)}
.fsort{gap:8px}
.fsort select{flex:1 1 0; min-width:0; border-radius:var(--r-sm); font-size:12.5px; min-height:34px}
.catfil{display:flex; flex-wrap:wrap; gap:6px; padding:2px 0 0}
.catfil button{
  font-size:12px; line-height:1; padding:7px 11px; border-radius:999px;
  border:1px solid var(--hair-strong); background:var(--surface); color:var(--ink-2);
  display:inline-flex; align-items:center; gap:6px;
}
.catfil button i{width:7px; height:7px; border-radius:50%; background:var(--s-neutral); flex:none}
.catfil button[aria-pressed="true"]{border-color:var(--ink); color:var(--ink); font-weight:600}
.catfil button.all{border-style:dashed}
.catfil button[aria-pressed="true"].all{border-style:solid; background:var(--ink); color:var(--on-ink)}
.fbtn{
  position:relative; flex:none; width:38px; height:38px; border-radius:50%;
  border:1px solid var(--hair-strong); background:var(--surface); color:var(--ink-2);
  display:grid; place-items:center; transition:background .12s, color .12s, border-color .12s;
}
.fbtn svg{width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round}
.fbtn:hover{background:var(--surface-2)}
.fbtn[aria-expanded="true"]{background:var(--ink); color:var(--on-ink); border-color:var(--ink)}
.fdot{position:absolute; top:0; right:0; width:9px; height:9px; border-radius:50%;
  background:var(--s1); border:2px solid var(--plane)}
.filters select{min-height:36px; padding:5px 9px; font-size:13px; width:auto; flex:1 1 0; min-width:0; border-radius:999px; text-overflow:ellipsis}
.filters input[type=search]{min-height:36px; padding:6px 13px; font-size:13.5px; border-radius:999px}

/* ============================================================ 進捗バー */
.prog{margin:12px 0 2px}
.prog .bar{display:flex; height:6px; border-radius:3px; overflow:hidden; background:var(--surface-3)}
.prog .bar i{display:block; height:100%; transition:width .4s cubic-bezier(.2,.9,.2,1)}
.prog .bar i.d{background:var(--good)}
.prog .bar i.p{background:var(--s1)}
.prog .meta{display:flex; align-items:center; gap:12px; margin-top:7px; font-size:11.5px; color:var(--muted); flex-wrap:wrap}
.prog .meta span{display:inline-flex; align-items:center; gap:5px}
.prog .meta i{width:8px; height:8px; border-radius:2px; flex:none}
.prog .meta b{color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums}
.prog .meta .sp{flex:1}
.prog-note{margin-top:7px; font-size:11.5px; color:var(--muted)}
.prog-note button{color:var(--ink-2); border-bottom:1px solid var(--hair-strong); padding-bottom:1px; font-size:11.5px}
.prog-note button:hover{color:var(--ink); border-bottom-color:var(--ink)}
.prog-note b{color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums}
.prog .rate{font-family:var(--serif); font-size:15px; color:var(--ink); letter-spacing:.03em}
.modesw{display:flex; gap:4px; background:var(--surface-2); border-radius:999px; padding:3px}
.modesw button{font-size:11.5px; padding:4px 11px; border-radius:999px; color:var(--muted)}
.modesw button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}

/* ============================================================ ボード（カンバン） */
.board{display:flex; gap:12px; overflow-x:auto; padding:4px 16px 8px; scroll-snap-type:x proximity;
  -webkit-overflow-scrolling:touch; scrollbar-width:none}
.board::-webkit-scrollbar{display:none}
.board .col{flex:0 0 84%; scroll-snap-align:start; display:flex; flex-direction:column; min-width:0}
@media (min-width:720px){ .board{padding:4px 0 8px; max-width:780px; margin:0 auto} .board .col{flex:1 1 0} }
.col-h{display:flex; align-items:center; gap:8px; padding:0 4px 8px; font-size:12.5px; letter-spacing:.04em}
.col-h i{width:9px; height:9px; border-radius:50%; flex:none}
.col-h b{font-weight:600}
.col-h span{color:var(--muted); font-variant-numeric:tabular-nums}
.col-body{background:var(--surface-2); border:1px solid var(--hair); border-radius:var(--r); padding:9px;
  display:flex; flex-direction:column; gap:8px; min-height:120px; max-height:62vh; overflow-y:auto}
.bcard{background:var(--surface); border:1px solid var(--hair); border-radius:var(--r-sm); padding:10px 11px;
  box-shadow:var(--shadow); display:flex; flex-direction:column; gap:7px}
.bcard .t{font-size:13.5px; line-height:1.5; word-break:break-word; text-align:left; width:100%}
.bcard .row{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.bcard .mv{margin-left:auto; display:flex; gap:4px}
.bcard .mv button{width:28px; height:28px; border:1px solid var(--hair-strong); border-radius:7px;
  display:grid; place-items:center; color:var(--ink-2); background:var(--surface)}
.bcard .mv button:hover{background:var(--surface-2); color:var(--ink)}
.bcard .mv button[disabled]{opacity:.3}
.bcard .mv svg{width:13px; height:13px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.col-empty{color:var(--muted); font-size:12px; text-align:center; padding:18px 6px}

/* ============================================================ list */
.group-h{
  display:flex; align-items:baseline; gap:9px; margin:22px 2px 8px;
  font-family:var(--serif); font-size:15px; letter-spacing:.06em; color:var(--ink);
}
.group-h:first-child{margin-top:6px}
.group-h span{font-family:var(--sans); font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums}
ul.items{list-style:none; margin:0; padding:0; background:var(--surface); border:1px solid var(--hair); border-radius:var(--r); overflow:hidden; box-shadow:var(--shadow)}
li.item{position:relative; overflow:hidden; border-top:1px solid var(--hair)}
li.item:first-child{border-top:0}
.item-in{
  display:flex; gap:12px; align-items:flex-start; padding:13px 14px;
  background:var(--surface); position:relative; touch-action:pan-y;
  transition:transform .18s cubic-bezier(.2,.9,.2,1), background .12s;
}
li.item.swiping .item-in{transition:none}
.item-in:hover{background:var(--surface-2)}
.swipe-bg{
  position:absolute; inset:0; display:flex; align-items:center; padding:0 18px;
  background:color-mix(in srgb, var(--good) 16%, var(--surface)); color:var(--ink-2); font-size:12.5px; gap:7px;
}
.swipe-bg.left{justify-content:flex-end; background:color-mix(in srgb, var(--s1) 14%, var(--surface)); display:none}
li.item.sw-left .swipe-bg{display:none}
li.item.sw-left .swipe-bg.left{display:flex}
.swipe-bg svg{width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
.tick{
  flex:none; width:23px; height:23px; margin-top:1px; border-radius:50%; position:relative;
  border:1.5px solid var(--hair-strong); display:grid; place-items:center; color:transparent;
  transition:background .14s, border-color .14s, color .14s;
}
.item.st-doing .tick{border-color:var(--s1); border-width:2px}
.item.st-doing .tick::after{content:''; width:9px; height:9px; border-radius:50%; background:var(--s1)}
.badge-doing{display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--s1); flex:none}
.badge-doing i{width:6px; height:6px; border-radius:50%; background:var(--s1)}
.tick svg{width:13px; height:13px; fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round}
.tick:hover{border-color:var(--ink-2)}
.item.done .tick{background:var(--good); border-color:var(--good); color:#fff}
.item-body{flex:1; min-width:0}
.item-t{font-size:15px; line-height:1.45; word-break:break-word}
.item.done .item-t{color:var(--ink-2)}
.item-sub{display:flex; align-items:center; gap:7px 9px; flex-wrap:wrap; margin-top:6px}
.item-sub .s{font-size:11.5px; color:var(--muted); display:inline-flex; align-items:center; gap:4px}
.item-sub .s svg{width:12px; height:12px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.item-right{flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:5px}
.stars{font-size:11px; letter-spacing:1px; color:var(--star)}
.empty{text-align:center; color:var(--muted); font-size:13.5px; padding:46px 16px; line-height:1.9}
.empty b{display:block; font-family:var(--serif); font-size:16px; color:var(--ink-2); font-weight:400; margin-bottom:6px}

/* ============================================================ sheet (detail / modal) */
.scrim{position:fixed; inset:0; background:rgba(10,10,9,.34); z-index:50; opacity:0; transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:51;
  max-height:92vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
  background:var(--surface); border-radius:18px 18px 0 0; box-shadow:var(--sheet-shadow);
  transform:translateY(102%); transition:transform .28s cubic-bezier(.2,.9,.2,1);
  padding-bottom:calc(18px + env(safe-area-inset-bottom));
}
.sheet.on{transform:translateY(0)}
@media (min-width:720px){
  .sheet{left:50%; right:auto; bottom:auto; top:50%; width:620px; max-width:calc(100vw - 32px);
    border-radius:var(--r); transform:translate(-50%,-44%) scale(.98); opacity:0; max-height:86vh}
  .sheet.on{transform:translate(-50%,-50%) scale(1); opacity:1}
}
.sheet-h{
  position:sticky; top:0; background:var(--surface); z-index:2;
  display:flex; align-items:center; gap:10px; padding:14px 16px 12px; border-bottom:1px solid var(--hair);
}
.sheet-h h3{font-family:var(--serif); font-size:16px; font-weight:400; letter-spacing:.05em; flex:1}
.sheet-b{padding:16px}
.sheet-f{
  position:sticky; bottom:0; background:var(--surface); border-top:1px solid var(--hair);
  display:flex; gap:9px; padding:12px 16px; align-items:center;
}
.grab{width:38px; height:4px; border-radius:2px; background:var(--hair-strong); margin:8px auto 0}
@media (min-width:720px){.grab{display:none}}
.hist{margin:0; padding:0; list-style:none; font-size:12px; color:var(--muted)}
.hist li{padding:5px 0; border-top:1px solid var(--hair); display:flex; gap:8px; font-variant-numeric:tabular-nums}
.hist li:first-child{border-top:0}
details.fold summary{cursor:pointer; font-size:12.5px; color:var(--muted); padding:6px 0; letter-spacing:.03em}
details.fold summary::marker{color:var(--hair-strong)}

/* ============================================================ triage */
.tri-wrap{display:flex; flex-direction:column; gap:14px}
.tri-card{
  min-height:224px; display:flex; flex-direction:column; justify-content:center; gap:16px;
  padding:36px 24px; text-align:center;
}
.tri-card .t{font-family:var(--serif); font-size:24px; line-height:1.5; letter-spacing:.03em; word-break:break-word}
.tri-prog{display:flex; align-items:center; gap:10px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
.tri-bar{flex:1; height:3px; border-radius:2px; background:var(--surface-3); overflow:hidden}
.tri-bar i{display:block; height:100%; background:var(--s1); border-radius:2px; transition:width .3s}
.tri-btns{display:flex; flex-direction:column; gap:9px}
.tri-btns .big{
  display:flex; align-items:center; gap:12px; text-align:left;
  min-height:58px; padding:0 17px; border:1px solid var(--hair-strong); border-radius:var(--r-sm);
  background:var(--surface); box-shadow:var(--shadow);
}
.tri-btns .big:hover{background:var(--surface-2)}
.tri-btns .big .dot{width:11px; height:11px; border-radius:50%; flex:none}
.tri-btns .big .lab{flex:1; font-size:15px}
.tri-btns .big .key{font-size:11px; color:var(--muted); border:1px solid var(--hair); border-radius:5px; padding:1px 6px; font-variant-numeric:tabular-nums}

/* ============================================================ charts */
.viz{margin:0 0 16px}
.viz-h{display:flex; align-items:baseline; gap:10px; margin:0 0 3px; padding:0 2px}
.viz-h h3{font-size:14px; font-weight:600; letter-spacing:.02em}
.viz-h .sp{flex:1}
.viz-note{font-size:11.5px; color:var(--muted); margin:0 2px 10px; line-height:1.6}
.viz-box{padding:14px 12px 10px}
.legend{display:flex; flex-wrap:wrap; gap:6px 14px; padding:10px 4px 2px; font-size:11.5px; color:var(--ink-2)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:11px; height:11px; border-radius:3px; flex:none}
.legend i.ln{width:14px; height:2px; border-radius:2px}
svg.chart{display:block; width:100%; overflow:visible; font-family:var(--sans)}
svg.chart text{font-size:10.5px; fill:var(--muted); font-variant-numeric:tabular-nums}
svg.chart .grid{stroke:var(--grid); stroke-width:1}
svg.chart .axis{stroke:var(--axis); stroke-width:1}
svg.chart .band{fill:transparent}
svg.chart .band:hover, svg.chart .band:focus-visible{fill:color-mix(in srgb, var(--ink) 5%, transparent); outline:none}
#tip{
  position:fixed; z-index:70; pointer-events:none; opacity:0; transition:opacity .12s;
  background:var(--surface); border:1px solid var(--hair-strong); border-radius:10px;
  box-shadow:var(--shadow); padding:9px 11px; font-size:12px; min-width:132px;
}
#tip.on{opacity:1}
#tip .tt{font-size:11px; color:var(--muted); margin-bottom:5px; letter-spacing:.04em}
#tip .tr{display:flex; align-items:center; gap:8px; padding:2px 0}
#tip .tr i{width:12px; height:2px; border-radius:2px; flex:none}
#tip .tr .v{margin-left:auto; font-weight:600; font-variant-numeric:tabular-nums}
#tip .tr .n{color:var(--ink-2)}
table.dt{width:100%; border-collapse:collapse; font-size:12.5px; font-variant-numeric:tabular-nums}
table.dt th, table.dt td{text-align:right; padding:6px 8px; border-top:1px solid var(--hair); white-space:nowrap}
table.dt th:first-child, table.dt td:first-child{text-align:left}
table.dt thead th{color:var(--muted); font-weight:500; border-top:0; font-size:11.5px}
.tscroll{overflow-x:auto}

/* stat tiles */
.kpis{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:0 0 16px}
@media (min-width:560px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{padding:13px 14px}
.kpi .l{font-size:11.5px; color:var(--muted); letter-spacing:.03em}
.kpi .v{font-size:25px; line-height:1.25; margin-top:2px; font-weight:600}
.kpi .d{font-size:11px; color:var(--muted); margin-top:1px}

/* ============================================================ timeline */
.tl{margin:0; padding:0; list-style:none}
.tl-m{font-family:var(--serif); font-size:14px; letter-spacing:.06em; color:var(--muted); margin:20px 2px 8px}
.tl li{display:flex; gap:13px; padding:11px 0; border-top:1px solid var(--hair)}
.tl li:first-child{border-top:0}
.tl .d{flex:none; width:36px; font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; padding-top:2px}
.tl .b{flex:1; min-width:0}
.tl .b .t{font-size:14.5px}
.tl .b .r{font-size:12.5px; color:var(--ink-2); margin-top:4px; padding-left:10px; border-left:2px solid var(--hair-strong); line-height:1.65}

/* ============================================================ 分析（読み物） */
.paper{
  background:var(--surface); border:1px solid var(--hair); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 20px 18px; margin:0 0 18px; position:relative;
}
@media (min-width:720px){ .paper{padding:32px 36px 26px} }
.paper-h{display:flex; align-items:flex-start; gap:16px; padding-bottom:16px; border-bottom:1px solid var(--hair)}
.paper-h .pd{
  flex:none; display:flex; align-items:baseline; gap:1px; font-family:var(--serif);
  color:var(--ink); letter-spacing:0; line-height:1;
}
.paper-h .pd b{font-size:27px; font-weight:400}
.paper-h .pd span{font-size:12px; color:var(--muted); margin-right:3px}
.paper-h .pt{min-width:0}
.paper-h h3{font-family:var(--serif); font-size:18px; font-weight:400; letter-spacing:.04em; line-height:1.5}
.paper-h p{margin:5px 0 0; font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums}
.paper-b{padding-top:4px}
.paper-b.clipped{max-height:168px; overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,#000 60%,transparent); mask-image:linear-gradient(180deg,#000 60%,transparent)}
.paper .more{
  display:block; width:100%; margin-top:10px; padding:9px; border:1px solid var(--hair-strong);
  border-radius:var(--r-sm); font-size:12.5px; color:var(--ink-2); background:var(--surface);
}
.paper .more:hover{background:var(--surface-2); color:var(--ink)}
.toc{margin:14px 0 18px; border:1px solid var(--hair); border-radius:var(--r-sm); background:var(--surface-2)}
.toc > summary{cursor:pointer; list-style:none; padding:9px 13px; font-size:11.5px; letter-spacing:.06em;
  color:var(--muted); display:flex; align-items:center; gap:7px}
.toc > summary::-webkit-details-marker{display:none}
.toc > summary::after{content:'▾'; margin-left:auto; font-size:10px}
.toc[open] > summary::after{content:'▴'}
.toc ol{margin:0; padding:2px 13px 12px 30px; counter-reset:toc}
.toc li{margin:4px 0; font-size:12.5px}
.toc a{color:var(--ink-2); text-decoration:none; border-bottom:1px solid transparent}
.toc a:hover{color:var(--ink); border-bottom-color:var(--hair-strong)}

/* ============================================================ markdown (analyses) */
.md{font-size:14.5px; line-height:1.95; color:var(--ink); max-width:34em}
.md > p:first-of-type{font-size:15px; color:var(--ink-2)}
.md h2{scroll-margin-top:72px}
.md h2::before{content:''; display:block; width:26px; height:2px; background:var(--s1); margin-bottom:10px; border-radius:1px}
.md strong{background:linear-gradient(transparent 62%, color-mix(in srgb, var(--s4) 32%, transparent) 62%)}
.md table{font-variant-numeric:tabular-nums}
.md tbody tr:nth-child(even){background:color-mix(in srgb, var(--surface-2) 55%, transparent)}
.md blockquote{position:relative; padding:4px 0 4px 16px; border-left:2px solid var(--s1);
  font-family:var(--serif); font-size:15px; line-height:1.9; color:var(--ink)}
.md h1,.md h2,.md h3{font-family:var(--serif); font-weight:400; letter-spacing:.04em; line-height:1.5}
.md h1{font-size:19px; margin:20px 0 8px}
.md h2{font-size:17.5px; margin:32px 0 10px}
.md h3{font-size:15px; margin:22px 0 6px; color:var(--ink-2)}
.md p{margin:9px 0}
.md ul,.md ol{margin:9px 0; padding-left:1.35em}
.md li{margin:3px 0}
.md code{background:var(--surface-2); border-radius:4px; padding:1px 5px; font-size:12.5px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.md pre{background:var(--surface-2); border-radius:var(--r-sm); padding:12px; overflow-x:auto; font-size:12.5px}
.md pre code{background:none; padding:0}
.md blockquote{margin:12px 0; padding:2px 0 2px 13px; border-left:2px solid var(--hair-strong); color:var(--ink-2)}
.md hr{border:0; border-top:1px solid var(--hair); margin:18px 0}
.mdtable{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:14px 0; border-radius:var(--r-sm)}
.mdtable::-webkit-scrollbar{height:4px}
.mdtable::-webkit-scrollbar-thumb{background:var(--hair-strong); border-radius:2px}
.md table{border-collapse:collapse; font-size:13px; margin:0; width:100%; min-width:26em}
.md th,.md td{border:1px solid var(--hair); padding:7px 10px; text-align:left}
.md th{background:var(--surface-2); font-weight:600}
.md strong{font-weight:600}
.an-h{display:flex; align-items:baseline; gap:10px; margin:0 0 4px}
.an-h .dt{font-family:var(--serif); font-size:17px; letter-spacing:.04em}
.an-h .rg{font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums}

/* ============================================================ data view */
.drow{display:flex; align-items:center; gap:12px; padding:14px 16px; border-top:1px solid var(--hair)}
.drow:first-child{border-top:0}
.drow .dl{flex:1; min-width:0}
.drow .dl b{display:block; font-weight:600; font-size:14px}
.drow .dl span{display:block; font-size:12px; color:var(--muted); margin-top:2px; line-height:1.55}
.prev{display:grid; grid-template-columns:1fr auto; gap:3px 14px; font-size:13.5px; margin:4px 0 0}
.prev .n{font-variant-numeric:tabular-nums; font-weight:600; text-align:right}
.prev .warn{color:var(--critical)}
kbd{
  font-family:var(--sans); font-size:11px; border:1px solid var(--hair-strong);
  border-bottom-width:2px; border-radius:5px; padding:1px 6px; color:var(--ink-2); background:var(--surface-2);
}
.klist{display:grid; grid-template-columns:auto 1fr; gap:7px 12px; font-size:12.5px; align-items:baseline}
.klist .kk{text-align:right}
</style>
</head>

<script>
"use strict";
/* ============================================================================
   やりたいことリスト — 単一HTMLアプリ（ビルド不要 / 外部依存ゼロ）
   データの正本はローカルの ~/Life/bucket-list/data/master.json。
   このアプリは IndexedDB を作業コピーとして持ち、JSONで往復する。
   スキーマとマージ規則は bucket-list/CLAUDE.md と同一仕様。
   ========================================================================== */

/* ---------- 定数 ---------- */
const SCHEMA_VERSION = 1;
/* お金の区分は2択。「お金をかけてでもやりたいか、否か」だけを持つ。
   JSON上のフィールド名は仕様どおり money。旧データの 'paid'（そこまででもない）は 'free' に寄せる */
const MONEY = {
  pay : { label:'お金を出してでもやりたい', short:'出してでも', cls:'m-pay',  varName:'--s1' },
  hold: { label:'そこまでは出さない',       short:'出さない',   cls:'m-hold', varName:'--s2' },
  none: { label:'お金はかからない',         short:'かからない', cls:'m-none', varName:'--s3' },
};
const MONEY_KEYS  = ['pay','hold','none'];
/* 旧データの読み替え。'paid'（そこまででもない）は意味が近い hold へ。
   'free'（タダならやる）は「かからない」と「そこまでは出さない」のどちらとも読めるので
   読み替えずに未設定へ落とす（＝仕分けし直してもらう） */
const MONEY_LEGACY = { paid:'hold' };
/* 積み上げ順: 未設定(neutral) を端に置く。隣接ペアのCVD分離を検証済み（dataviz validator） */
const MONEY_STACK = ['', 'pay', 'hold', 'none'];
const WTP = [
  { v:'1k',   label:'〜1千円' },
  { v:'10k',  label:'〜1万円' },
  { v:'30k',  label:'〜3万円' },
  { v:'50k',  label:'〜5万円' },
  { v:'100k', label:'〜10万円' },
  { v:'200k', label:'〜20万円' },
  { v:'300k', label:'〜30万円' },
  { v:'500k', label:'〜50万円' },
  { v:'1m',   label:'〜100万円' },
  { v:'1m+',  label:'100万円+' },
];
/* 旧4段階（〜1千/〜1万/〜10万/10万+）で入れた値の読み替え。
   旧「10万+」は 10万〜∞ なので、新しい区分では控えめに「〜20万円」に寄せる。 */
const WTP_LEGACY = { '100k+':'200k' };
const WTP_KEYS = WTP.map(w=>w.v);
const wtpCode = v => (WTP_LEGACY[v] || v);
const WTP_LABEL = Object.fromEntries(WTP.map(w=>[w.v,w.label]));
/* 進み具合。done は status から導く派生値として JSON に残す（旧データとの互換） */
const STATUS = {

const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uuid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{
      const r = Math.random()*16|0, v = c==='x' ? r : (r&0x3|0x8); return v.toString(16); });
const nowISO = () => new Date().toISOString();
const pad2 = n => String(n).padStart(2,'0');
const todayStr = () => { const d=new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
const isISO = s => typeof s==='string' && /^\d{4}-\d{2}-\d{2}([T ]|$)/.test(s) && !isNaN(new Date(s).getTime());
const dayOf = s => isISO(s) ? String(s).slice(0,10) : null;
const monthOf = s => isISO(s) ? String(s).slice(0,7) : null;
const cssVar = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim() || '#888';
const fmtDay = d => d ? `${+d.slice(5,7)}/${+d.slice(8,10)}` : '';
const fmtMonthLabel = m => `${+m.slice(5,7)}月`;

const clamp = (n,a,b)=>Math.max(a,Math.min(b,n));

/* ============================================================================
   スキーマ: 正規化（外部入力は必ずここを通す）
   ========================================================================== */
function normalizeItem(raw){
  if(!raw || typeof raw!=='object') return null;
  const title = String(raw.title==null?'':raw.title).trim();
  if(!title) return null;
  const rawMoney = MONEY_LEGACY[raw.money] || raw.money;
  const money = MONEY_KEYS.includes(rawMoney) ? rawMoney : null;
  const createdAt = isISO(raw.createdAt) ? raw.createdAt : nowISO();
  /* status が正。無ければ done から起こす（旧データ） */
  let status = STATUS_KEYS.includes(raw.status) ? raw.status : (raw.done===true ? 'done' : 'todo');
  const done = status==='done';
  let doneAt = dayOf(raw.doneAt);
  if(done && !doneAt) doneAt = todayStr();
  if(!done) doneAt = null;
  let startedAt = dayOf(raw.startedAt);
  if(status==='todo') startedAt = null;
  if(status!=='todo' && !startedAt) startedAt = doneAt || todayStr();
  let sat = Number.isFinite(+raw.satisfaction) ? Math.round(+raw.satisfaction) : null;
  if(sat!=null) sat = (sat>=1 && sat<=5) ? sat : null;
  const history = Array.isArray(raw.history) ? raw.history
    .filter(h=>h && typeof h==='object' && isISO(h.at) && typeof h.field==='string')
    .map(h=>({ at:h.at, field:String(h.field), from:h.from===undefined?null:h.from, to:h.to===undefined?null:h.to }))
    : [];
  return {
    id: (typeof raw.id==='string' && raw.id.trim()) ? raw.id.trim() : uuid(),
    title,
    category: String(raw.category==null?'':raw.category).trim(),
    memo: String(raw.memo==null?'':raw.memo),
    money,
    /* wtp は画面から外したが、入力済みの金額帯は消さずに持ち回す（往復でも失わない） */
    wtp: WTP_KEYS.includes(wtpCode(raw.wtp)) ? wtpCode(raw.wtp) : null,
    when: String(raw.when==null?'':raw.when).trim(),
    nextStep: String(raw.nextStep==null?'':raw.nextStep).trim(),
    status,
    done,          // status==='done' と同値。読む側の互換のために残す
    doneAt,
    startedAt,
    reflection: String(raw.reflection==null?'':raw.reflection),
    satisfaction: sat,
    source: raw.source==='initial' ? 'initial' : 'app',
    createdAt,
    updatedAt: isISO(raw.updatedAt) ? raw.updatedAt : createdAt,
    deletedAt: isISO(raw.deletedAt) ? raw.deletedAt : null,
    history: history.sort((a,b)=>a.at<b.at?-1:1),
  };
}
function normalizeAnalysis(raw){
  if(!raw || typeof raw!=='object') return null;
  const summary = String(raw.summary==null?'':raw.summary);
  if(!summary.trim()) return null;
  return {
    id: (typeof raw.id==='string' && raw.id.trim()) ? raw.id.trim() : uuid(),
    createdAt: isISO(raw.createdAt) ? raw.createdAt : nowISO(),
    periodFrom: dayOf(raw.periodFrom),
    periodTo: dayOf(raw.periodTo),
    summary,
  };
}

/* ============================================================================
   マージ規則（B側 scripts/merge と同一仕様）
     - id で突き合わせ、updatedAt が新しい方を採用（同値なら手元を残す）
     - history は両方を統合して重複排除
     - deletedAt がある項目は復活させない（両者のうち最も早い削除時刻を残す）
     - analyses は id で和集合（同じidで中身が違えば取り込む側で置き換える）
   ========================================================================== */
const histKey = h => JSON.stringify([h.at, h.field, h.from, h.to]);
function unionHistory(a,b){
  const seen=new Set(), out=[];
  for(const h of [...(a||[]), ...(b||[])]){ const k=histKey(h); if(!seen.has(k)){ seen.add(k); out.push(h); } }
  return out.sort((x,y)=> x.at<y.at?-1: x.at>y.at?1:0);
}
function mergeItem(mine, theirs){
  const winner = (theirs.updatedAt > mine.updatedAt) ? theirs : mine;
  const merged = Object.assign({}, winner);
  merged.history = unionHistory(mine.history, theirs.history);
  const dels = [mine.deletedAt, theirs.deletedAt].filter(Boolean).sort();
  merged.deletedAt = dels.length ? dels[0] : null;
  return merged;
}
/** @returns {{items:Object[], analyses:Object[], stats:Object}} */
function mergeData(localItems, localAnalyses, incoming){
  const stats = { added:0, updated:0, same:0, keptDeleted:0, analysesAdded:0, analysesUpdated:0, skipped:0 };
  const map = new Map(localItems.map(i=>[i.id, i]));
  const rawItems = Array.isArray(incoming && incoming.items) ? incoming.items : [];
  for(const raw of rawItems){
    const it = normalizeItem(raw);
    if(!it){ stats.skipped++; continue; }
    const mine = map.get(it.id);
    if(!mine){ map.set(it.id, it); stats.added++; if(it.deletedAt) stats.keptDeleted++; continue; }
    const merged = mergeItem(mine, it);
    const changed = JSON.stringify(merged) !== JSON.stringify(mine);
    if(changed) stats.updated++; else stats.same++;
    if(merged.deletedAt && !it.deletedAt) stats.keptDeleted++;
    map.set(it.id, merged);
  }
  const amap = new Map(localAnalyses.map(a=>[a.id,a]));
  const rawAn = Array.isArray(incoming && incoming.analyses) ? incoming.analyses : [];
  for(const raw of rawAn){
    const a = normalizeAnalysis(raw);
    if(!a) continue;
    const mine = amap.get(a.id);
    if(!mine){ amap.set(a.id, a); stats.analysesAdded++; }
    else if(mine.summary!==a.summary || mine.periodFrom!==a.periodFrom || mine.periodTo!==a.periodTo){
      /* 同じidで中身が違う＝分析の書き直し。取り込む側で置き換える */
      amap.set(a.id, a); stats.analysesUpdated++;
    }
  }
  return {
    items: Array.from(map.values()),
    analyses: Array.from(amap.values()).sort((a,b)=> a.createdAt<b.createdAt?1:-1),
    stats,
  };
}

/* ============================================================================
   IndexedDB（作業コピー）
   ========================================================================== */
const DB_NAME='yaritai-list', DB_VER=1;
let db=null, dbBroken=false;
function openDB(){
  return new Promise((resolve,reject)=>{
    let req;
    try{ req = indexedDB.open(DB_NAME, DB_VER); }catch(e){ return reject(e); }
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if(!d.objectStoreNames.contains('items'))    d.createObjectStore('items',    {keyPath:'id'});
      if(!d.objectStoreNames.contains('analyses')) d.createObjectStore('analyses', {keyPath:'id'});
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror   = ()=>reject(req.error);
    req.onblocked = ()=>reject(new Error('IndexedDB blocked'));
  });
}
function tx(stores, mode){ return db.transaction(stores, mode); }
function idbAll(store){
  return new Promise((res,rej)=>{ const r=tx([store],'readonly').objectStore(store).getAll();
    r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error); });
}
function idbPut(store, objs){
  if(dbBroken || !db) return Promise.resolve();
  return new Promise((res,rej)=>{
    const t=tx([store],'readwrite'), s=t.objectStore(store);
    for(const o of objs) s.put(o);
    t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error);
  });
}
function idbReplaceAll(store, objs){
  if(dbBroken || !db) return Promise.resolve();
  return new Promise((res,rej)=>{
    const t=tx([store],'readwrite'), s=t.objectStore(store);
    s.clear(); for(const o of objs) s.put(o);
    t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error);
  });
}

/* ============================================================================
   共通UI: テーマ / トースト / シート
   ========================================================================== */
function applyTheme(){
  document.documentElement.dataset.theme = S.theme;
  document.body.dataset.pub = S.pub ? '1' : '0';
}
let toastTimer=null;
function toast(msg, actionLabel, actionFn){
  const el=$('#toast');
  el.hidden=false; el.textContent='';
  const span=document.createElement('span'); span.textContent=msg; el.appendChild(span);
  if(actionLabel){
    const b=document.createElement('button'); b.type='button'; b.textContent=actionLabel;
    b.addEventListener('click', ()=>{ hideToast(); actionFn && actionFn(); });
    el.appendChild(b);
  }
  requestAnimationFrame(()=>el.classList.add('on'));
  clearTimeout(toastTimer);
  toastTimer=setTimeout(hideToast, actionLabel?6000:2600);
}
function hideToast(){ const el=$('#toast'); el.classList.remove('on'); clearTimeout(toastTimer);
  setTimeout(()=>{ if(!el.classList.contains('on')) el.hidden=true; }, 300); }

let sheetCloser=null;
function openSheet(html, onMount){
  const old=$('#sheet'), sc=$('#scrim');
  /* 前に開いたシートのリスナーを必ず捨てる。
     同じ要素を使い回すと、古いシートの保存処理が生き残り、
     次に別の項目を保存したときに「いまのフォームの値」を古い項目にも書き込む。
     （実際にタイトルが2件上書きされた。cloneNode(false) で属性だけ引き継ぐ） */
  const sh=old.cloneNode(false);
  sh.classList.remove('on');
  old.replaceWith(sh);
  sh.innerHTML='<div class="grab"></div>'+html;
  sh.hidden=false; sc.hidden=false;
  requestAnimationFrame(()=>{ sh.classList.add('on'); sc.classList.add('on'); });
  document.body.style.overflow='hidden';
  sheetCloser = ()=>closeSheet();
  if(onMount) onMount(sh);
  const first=sh.querySelector('[data-autofocus]'); if(first) setTimeout(()=>first.focus(),260);
  return sh;
}
function closeSheet(){
  const sh=$('#sheet'), sc=$('#scrim');
  sh.classList.remove('on'); sc.classList.remove('on');
  document.body.style.overflow='';
  sheetCloser=null;
  setTimeout(()=>{ if(!sh.classList.contains('on')){ sh.hidden=true; sc.hidden=true; sh.innerHTML=''; } }, 300);
}

/* ============================================================================
   データ操作
   ========================================================================== */
function dbErr(e){ console.warn('IndexedDB error', e); dbBroken=true;
  toast('保存に失敗しました。エクスポートで退避してください'); }

function addItem(title, extra){
  const at=nowISO();
  const it = normalizeItem(Object.assign({
    id:uuid(), title, source:'app', createdAt:at, updatedAt:at, history:[]
  }, extra||{}));
  if(!it) return null;
  S.items.push(it);
  idbPut('items',[it]).catch(dbErr);
  return it;
}
const TRACKED = ['money','category','status'];
function updateItem(id, patch, opts){
  opts = opts||{};
  const it = byId(id); if(!it) return null;
  const at = nowISO();
  const hist=[];
  for(const f of TRACKED){
    if(Object.prototype.hasOwnProperty.call(patch,f) && patch[f]!==it[f]){
      hist.push({ at, field:f, from:it[f], to:patch[f] });
    }
  }
  Object.assign(it, patch);
  if(hist.length) it.history = it.history.concat(hist);
  it.updatedAt = at;
  const fixed = normalizeItem(it);
  Object.assign(it, fixed);
  idbPut('items',[it]).catch(dbErr);
  if(!opts.silent) renderAll();
  return it;
}
/* 状態を変える唯一の入口。done / doneAt / startedAt はここで辻褄を合わせる */
function setStatus(id, status, opts){
  const it = byId(id); if(!it || !STATUS_KEYS.includes(status)) return;
  const patch = { status };
  if(status==='done'){ patch.done=true; patch.doneAt = it.doneAt || todayStr();
                       patch.startedAt = it.startedAt || patch.doneAt; }
  else {
    patch.done=false; patch.doneAt=null; patch.satisfaction=null;
    patch.startedAt = status==='doing' ? (it.startedAt || todayStr()) : null;
  }
  updateItem(id, patch, opts);
}
function setDone(id, done, opts){ setStatus(id, done ? 'done' : 'todo', opts); }
function softDelete(id){
  const it=byId(id); if(!it) return;
  it.deletedAt = nowISO(); it.updatedAt = it.deletedAt;
  idbPut('items',[it]).catch(dbErr);
  renderAll();
  toast('削除しました（論理削除）', '取り消す', ()=>{
    it.deletedAt=null; it.updatedAt=nowISO(); idbPut('items',[it]).catch(dbErr); renderAll();
  });
}

const SORTS = [
  ['createdAt-desc','追加が新しい順'], ['createdAt-asc','追加が古い順'],
  ['doneAt-desc','完了が新しい順'],   ['money-desc','お金を出してでも が先'],
  ['title-asc','タイトル順'],
  ['updatedAt-desc','更新が新しい順'],
];
const GROUPS = [['none','グルーピングなし'],['category','カテゴリ別'],['money','お金の区分別'],['status','進み具合別']];
const STATUSES = [['all','すべて'],['todo','未着手'],['doing','着手中'],['done','完了']];

function usedCategories(){
  const set = new Set(live().map(i=>i.category).filter(Boolean));
  const out = CATEGORIES.filter(c=>set.has(c));
  for(const c of Array.from(set).sort()) if(!out.includes(c)) out.push(c);
  return out;
}
function fillSelects(){
  const opt=(v,l,sel)=>`<option value="${esc(v)}"${sel===v?' selected':''}>${esc(l)}</option>`;
  const chip=(v,l,cur,tint)=>{
    const on = cur===v;
    const style = (tint && on) ? ` style="background:color-mix(in srgb, var(${tint}) 14%, var(--surface)); border-color:color-mix(in srgb, var(${tint}) 45%, var(--hair))"` : '';
    const dot = tint ? `<i style="background:var(${tint})"></i>` : '';
    return `<button type="button" data-v="${esc(v)}" aria-pressed="${on}" class="${v===''?'all':''}"${style}>${dot}${esc(l)}</button>`;
  };
  $('#f-status').innerHTML = [chip('all','すべて',S.f.status,null)]
    .concat(STATUS_KEYS.map(k=>chip(k, STATUS[k].label, S.f.status, STATUS[k].varName))).join('');
  $('#f-money').innerHTML = [chip('','すべて',S.f.money,null)]
    .concat(MONEY_KEYS.map(k=>chip(k, MONEY[k].short, S.f.money, MONEY[k].varName)))
    .concat([chip('null','未設定',S.f.money,null)]).join('');
  const cats = usedCategories(), sel = new Set(S.f.cat);
  const hasNoCat = live().some(i=>!i.category);
  const catBtn = (v,l,tintVar)=>{
    const on = v==='' ? sel.size===0 : sel.has(v);
    const style = (tintVar && on) ? ` style="background:color-mix(in srgb, var(${tintVar}) 14%, var(--surface)); border-color:color-mix(in srgb, var(${tintVar}) 45%, var(--hair))"` : '';
    const dot = tintVar ? `<i style="background:var(${tintVar})"></i>` : '';
    return `<button type="button" data-cat="${esc(v)}" aria-pressed="${on}" class="${v===''?'all':''}"${style}>${dot}${esc(l)}</button>`;
  };
  $('#f-cat').innerHTML = [catBtn('','すべて',null)]
    .concat(cats.map(c=>catBtn(c, c, CAT_COLOR.get(c)||null)))
    .concat(hasNoCat ? [catBtn('__none','カテゴリなし',null)] : []).join('');
  $('#f-sort').innerHTML   = SORTS.map(([v,l])=>opt(v,l,S.sort)).join('');
  $('#f-group').innerHTML  = GROUPS.map(([v,l])=>opt(v,l,S.group)).join('');
}
function sortItems(arr){
  const mIdx = i => i.money ? MONEY_KEYS.indexOf(i.money) : MONEY_KEYS.length;
  const cmp = {
    'createdAt-desc': (a,b)=> a.createdAt<b.createdAt?1:a.createdAt>b.createdAt?-1:0,
    'createdAt-asc' : (a,b)=> a.createdAt<b.createdAt?-1:a.createdAt>b.createdAt?1:0,
    'doneAt-desc'   : (a,b)=> (b.doneAt||'').localeCompare(a.doneAt||''),
    'money-desc'    : (a,b)=> mIdx(a)-mIdx(b),
    'title-asc'     : (a,b)=> a.title.localeCompare(b.title,'ja'),
    'updatedAt-desc': (a,b)=> a.updatedAt<b.updatedAt?1:-1,
  }[S.sort] || ((a,b)=>0);
  return arr.slice().sort((a,b)=>{ const r=cmp(a,b); return r!==0?r: a.title.localeCompare(b.title,'ja'); });
}
function visibleItems(){
  const q=S.f.q.trim().toLowerCase();
  let arr=live();
  if(STATUS_KEYS.includes(S.f.status)) arr=arr.filter(i=>i.status===S.f.status);
  if(S.f.money==='null') arr=arr.filter(i=>i.money===null);
  else if(S.f.money) arr=arr.filter(i=>i.money===S.f.money);
  if(S.f.cat.length){
    const want=new Set(S.f.cat);
    arr=arr.filter(i=> i.category ? want.has(i.category) : want.has('__none'));
  }
  if(q) arr=arr.filter(i=>[i.title,i.category,i.memo,i.when,i.nextStep,i.reflection]
    .join(' ').toLowerCase().includes(q));
  return sortItems(arr);
}

   同じカテゴリが一覧でもグラフでも同じ色になる。 */

  CAT_COLOR = new Map();
  const { top } = topCategories(7);
  top.forEach((c,n)=>CAT_COLOR.set(c, SERIES_VARS[n]));

function stars(n){ return n ? `<span class="stars sens" aria-label="満足度${n}">${'★'.repeat(n)}${'☆'.repeat(5-n)}</span>` : ''; }
function itemRow(i){

  if(!i.done && i.nextStep) sub.push(`<span class="s sens">${ICON.step}${esc(i.nextStep)}</span>`);

    <div class="item-in">
      <button class="tick" data-act="tick" aria-pressed="${i.done}" aria-label="${i.done?'未着手に戻す':'完了にする'}">${ICON.check}</button>
      <div class="item-body" data-act="open" role="button" tabindex="0" aria-label="${esc(i.title)} の詳細">

      </div>
      <div class="item-right">${moneyChip(i)}${stars(i.satisfaction)}</div>
    </div>
  </li>`;
}
function groupOf(i){
  if(S.group==='category') return i.category || '（カテゴリなし）';
  if(S.group==='money')    return i.money ? MONEY[i.money].label : '未設定';
  if(S.group==='status')   return STATUS[i.status].label;
  return '';
}
function filtersActive(){
  return S.f.status!=='all' || S.f.money!=='' || S.f.cat.length>0 ||
         S.sort!=='createdAt-desc' || S.group!=='none';
}
function applyFilterUI(){
  const open = S.filterOpen || filtersActive();
  $('#f-more').hidden = !open;
  $('#f-toggle').setAttribute('aria-expanded', String(open));
  $('#f-toggle').querySelector('.fdot').hidden = !filtersActive();
}
function progress(){
  const all=live();
  const n={todo:0,doing:0,done:0};
  for(const i of all) n[i.status]++;
  const t=all.length||1;
  return { ...n, total:all.length, pDone:n.done/t*100, pDoing:n.doing/t*100,
           rate: Math.round(n.done/t*100) };
}
function renderProgress(){
  const p=progress();
  const all=live(), nUnset=all.filter(i=>i.money===null).length;
  $('#prog').innerHTML = `
    <div class="bar" role="img" aria-label="完了${p.done}件 着手中${p.doing}件 未着手${p.todo}件">
      <i class="d" style="width:${p.pDone.toFixed(1)}%"></i><i class="p" style="width:${p.pDoing.toFixed(1)}%"></i>
    </div>
    <div class="meta">
      <span class="rate">${p.rate}%</span>
      <span><i style="background:var(--good)"></i>完了 <b>${p.done}</b></span>
      <span><i style="background:var(--s1)"></i>着手中 <b>${p.doing}</b></span>
      <span><i style="background:var(--surface-3)"></i>未着手 <b>${p.todo}</b></span>
      <span class="sp"></span>
      <span class="modesw" role="group" aria-label="表示切替">
        <button type="button" data-mode="list" aria-pressed="${S.mode!=='board'}">リスト</button>
        <button type="button" data-mode="board" aria-pressed="${S.mode==='board'}">ボード</button>
      </span>
    </div>
    ${nUnset?`<div class="prog-note"><button type="button" data-go="triage">お金の区分が未設定の <b>${nUnset}</b> 件を仕分ける</button></div>`:''}
    ${(()=>{ const a=visibleItems().length; return a!==p.total
        ? `<div class="prog-note"><span>絞り込み中: <b>${a}</b> / ${p.total} 件</span></div>` : ''; })()}`;
}
function renderList(){
  fillSelects();
  applyFilterUI();
  renderProgress();
  const boardMode = S.mode==='board';
  $('#board-out').hidden = !boardMode;
  $('#list-out').hidden = boardMode;
  if(boardMode){ renderBoard(); }
  $('#f-q').value = S.f.q;
  const arr = visibleItems();
  const out=$('#list-out');
  if(boardMode) return;
  if(!arr.length){
    out.innerHTML = `<div class="card pad empty"><b>まだ何もありません</b>上の欄にタイトルだけ書いて Enter。<br>詳しいことは後から埋められます。</div>`;
    return;
  }
  if(S.group==='none'){ out.innerHTML = `<ul class="items">${arr.map(itemRow).join('')}</ul>`; return; }
  const groups=new Map();
  for(const i of arr){ const g=groupOf(i); if(!groups.has(g)) groups.set(g,[]); groups.get(g).push(i); }
  let keys=Array.from(groups.keys());
  if(S.group==='money') keys.sort((a,b)=>{
    const ord=[MONEY.pay.label,MONEY.hold.label,MONEY.none.label,'未設定'];
    return ord.indexOf(a)-ord.indexOf(b); });
  else if(S.group==='category') keys.sort((a,b)=>{
    const ci=c=>{ const k=CATEGORIES.indexOf(c); return k<0?99:k; };
    return ci(a)-ci(b) || a.localeCompare(b,'ja'); });
  else if(S.group==='status') keys.sort((a,b)=>{
    const ord=STATUS_KEYS.map(k=>STATUS[k].label); return ord.indexOf(a)-ord.indexOf(b); });
  else keys.sort();
  out.innerHTML = keys.map(k=>`<div class="group-h">${esc(k)}<span>${groups.get(k).length}</span></div>
    <ul class="items">${groups.get(k).map(itemRow).join('')}</ul>`).join('');
}

/* ---------- 行の操作: タップ / スワイプ ---------- */
function bindListGestures(){
  const out=$('#list-out');
  out.addEventListener('click', e=>{
    const li=e.target.closest('li.item'); if(!li) return;
    if(li.dataset.swiped==='1'){ li.dataset.swiped='0'; return; }
    const act=e.target.closest('[data-act]');
    if(act && act.dataset.act==='tick'){ toggleDoneFlow(li.dataset.id); return; }
    if(act && act.dataset.act==='open'){ openDetail(li.dataset.id); }
  });
  out.addEventListener('keydown', e=>{
    if(e.key!=='Enter' && e.key!==' ') return;
    const b=e.target.closest('[data-act="open"]'); if(!b) return;
    e.preventDefault(); openDetail(b.closest('li.item').dataset.id);
  });
  let sx=0, sy=0, li=null, inn=null, active=false, moved=false;
  out.addEventListener('pointerdown', e=>{
    if(e.pointerType==='mouse') return;
    if(e.target.closest('[data-act="tick"]')) return;
    li=e.target.closest('li.item'); if(!li) return;
    inn=li.querySelector('.item-in'); sx=e.clientX; sy=e.clientY; active=true; moved=false;
  }, {passive:true});
  out.addEventListener('pointermove', e=>{
    if(!active||!li) return;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(Math.abs(dy)>22 && Math.abs(dy)>Math.abs(dx)){ reset(); return; }
    if(Math.abs(dx)>6){
      moved=true; li.classList.add('swiping');
      li.classList.toggle('sw-left', dx<0);
      inn.style.transform=`translateX(${dx>0?Math.min(dx,130):Math.max(dx,-130)}px)`;
    }
  }, {passive:true});
  const reset=()=>{ if(inn){ li.classList.remove('swiping','sw-left'); inn.style.transform=''; } active=false; li=null; inn=null; };
  out.addEventListener('pointerup', e=>{
    if(!active||!li) return;
    const dx=e.clientX-sx, id=li.dataset.id, el=li;
    if(moved && dx>72){ el.dataset.swiped='1'; reset(); toggleDoneFlow(id); return; }
    if(moved && dx<-72){ el.dataset.swiped='1'; reset(); toggleDoingFlow(id); return; }
    reset();
  });
  out.addEventListener('pointercancel', reset);
}
function toggleDoingFlow(id){
  const it=byId(id); if(!it) return;
  const next = it.status==='doing' ? 'todo' : 'doing';
  setStatus(id, next);
  toast(next==='doing' ? `着手中: ${it.title.slice(0,14)}${it.title.length>14?'…':''}` : '未着手に戻しました');
}
function toggleDoneFlow(id){
  const it=byId(id); if(!it) return;
  const next=!it.done;
  setDone(id, next);
  if(next) toast(`完了: ${it.title.slice(0,14)}${it.title.length>14?'…':''}`, 'ひとこと残す', ()=>openDetail(id,{focus:'reflection'}));
  else toast('未着手に戻しました');
}

function triageAct(key){
  const cur = triageCurrent();
  if(!cur.item) return;
  const map={'1':'pay','2':'hold','3':'none'};
  if(!map[key]) return;
  S.lastTriage = { id:cur.item.id, money:cur.item.money };
  updateItem(cur.item.id, { money:map[key] }, {silent:true});
  renderAll();
}
function bindTriage(){
  $('#triage-out').addEventListener('click', e=>{
    const b=e.target.closest('[data-t],[data-w]'); if(!b) return;
    const t=b.dataset.t;
    const queue = live().filter(i=>i.money===null);
    if(t==='1'||t==='2'||t==='3') return triageAct(t);
    if(t==='skip'){ const i=queue[0]; if(i){ S.items=S.items.filter(x=>x!==i).concat([i]); renderTriage(); } return; }
    if(t==='undo' && S.lastTriage){
      const l=S.lastTriage;
      updateItem(l.id, { money:l.money }, {silent:true});
      S.lastTriage=null; renderAll(); return;
    }
    if(t==='detail'){ const i=queue[0]; if(i) openDetail(i.id); }
  });
}

/* ============================================================================
   グラフ（自前SVG / 外部依存なし）
   仕様は dataviz スキル準拠:
     - 棒は24px上限・上端4px丸め・ベースラインは角
     - 積み上げ・隣接棒のあいだは 2px のサーフェス色ギャップ（枠線は引かない）
     - グリッド/軸はヘアライン・実線
     - 2系列以上は必ず凡例。直接ラベルは端点だけ
     - どのグラフにも「表で見る」の等価表示（色だけに意味を持たせない）
   ========================================================================== */
/* 件数は整数。0.5件のような目盛りを出さないよう、刻みを整数から選ぶ */
function niceTicks(v){
  const steps=[1,2,5,10,20,25,50,100,200,250,500,1000,2000,5000];
  const top=Math.max(1, Math.ceil(v));
  for(const st of steps){
    if(top/st<=4){
      const max=Math.ceil(top/st)*st, ticks=[];
      for(let t=0;t<=max;t+=st) ticks.push(t);
      return { max, ticks };
    }
  }
  return { max:top, ticks:[0,top] };
}
function barPath(x,y,w,h,r){
  if(h<=0) return '';
  r=Math.min(r, w/2, h);
  return `M${x},${y+h} L${x},${y+r} Q${x},${y} ${x+r},${y} L${x+w-r},${y} Q${x+w},${y} ${x+w},${y+r} L${x+w},${y+h} Z`;
}
const svgEsc = s => String(s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ---------- tooltip ---------- */
let tipHideT=null;
function showTip(ev, title, rows){
  const tip=$('#tip');
  tip.textContent='';
  const h=document.createElement('div'); h.className='tt'; h.textContent=title; tip.appendChild(h);
  for(const r of rows){
    const d=document.createElement('div'); d.className='tr';
    const i=document.createElement('i'); i.style.background=r.color; d.appendChild(i);
    const n=document.createElement('span'); n.className='n'; n.textContent=r.label; d.appendChild(n);
    const v=document.createElement('span'); v.className='v'; v.textContent=r.value; d.appendChild(v);
    tip.appendChild(d);
  }
  const pad=12, r=tip.getBoundingClientRect();
  let x, y;
  if(ev && ev.clientX!=null && ev.clientX!==0){ x=ev.clientX+14; y=ev.clientY-10; }
  else { const b=(ev.target||ev.currentTarget).getBoundingClientRect(); x=b.left+b.width/2+10; y=b.top; }
  x=clamp(x, pad, window.innerWidth-r.width-pad);
  y=clamp(y, pad, window.innerHeight-r.height-pad);
  tip.style.left=x+'px'; tip.style.top=y+'px';
  tip.classList.add('on');
  clearTimeout(tipHideT);
}
function hideTip(){ clearTimeout(tipHideT); tipHideT=setTimeout(()=>$('#tip').classList.remove('on'), 60); }

/* ---------- 月別: 追加数・完了数（グループ化した縦棒） ---------- */
function drawColumns(host, months, series){
  const W = Math.max(280, host.clientWidth || 320), H = 176;
  const pad = { l:28, r:10, t:14, b:26 };
  const iw = W-pad.l-pad.r, ih = H-pad.t-pad.b;
  const nt = niceTicks(Math.max(1, ...series.flatMap(s=>s.values)));
  const maxV = nt.max, ticks = nt.ticks;
  const y = v => pad.t + ih - (v/maxV)*ih;
  const band = iw/months.length;
  const GAP=2, maxBarW=24;
  const barW = Math.max(3, Math.min(maxBarW, (band-8-GAP*(series.length-1))/series.length));
  let s='';
  for(const t of ticks){
    s+=`<line class="grid" x1="${pad.l}" x2="${W-pad.r}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"/>`;
    s+=`<text x="${pad.l-6}" y="${(y(t)+3.5).toFixed(1)}" text-anchor="end">${t}</text>`;
  }
  s+=`<line class="axis" x1="${pad.l}" x2="${W-pad.r}" y1="${y(0)}" y2="${y(0)}"/>`;
  months.forEach((m,n)=>{
    const cx = pad.l + band*n + band/2;
    const groupW = barW*series.length + GAP*(series.length-1);
    series.forEach((se,k)=>{
      const v=se.values[n]; if(!v) return;
      const x = cx - groupW/2 + k*(barW+GAP);
      s+=`<path d="${barPath(x, y(v), barW, y(0)-y(v), 4)}" fill="${se.color}"/>`;
    });
    const lab = (n===0 || m.slice(5)==='01') ? `${m.slice(2,4)}/${m.slice(5)}` : fmtMonthLabel(m);
    s+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${svgEsc(lab)}</text>`;
    // 端点だけ直接ラベル（最終月）
    if(n===months.length-1){
      series.forEach((se,k)=>{
        const v=se.values[n]; if(!v) return;
        const x = cx - groupW/2 + k*(barW+GAP);
        s+=`<text x="${x+barW/2}" y="${(y(v)-5).toFixed(1)}" text-anchor="middle" style="fill:var(--ink-2); font-weight:600">${v}</text>`;
      });
    }
    s+=`<rect class="band" x="${pad.l+band*n}" y="${pad.t}" width="${band}" height="${ih}" tabindex="0"
        data-n="${n}" role="img" aria-label="${svgEsc(fmtYM(m))} ${series.map(se=>se.label+se.values[n]+'件').join(' ')}"/>`;
  });
  host.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="group">${s}</svg>`;
  host.querySelectorAll('.band').forEach(b=>{
    const n=+b.dataset.n;
    const show=ev=>showTip(ev, fmtYM(months[n]), series.map(se=>({label:se.label, color:se.color, value:se.values[n]+'件'})));
    b.addEventListener('pointerenter',show); b.addEventListener('pointermove',show); b.addEventListener('focus',show);
    b.addEventListener('pointerleave',hideTip); b.addEventListener('blur',hideTip);
  });
}

/* ---------- 100%積み上げ（構成比の推移） ---------- */
function drawStack100(host, months, cats, matrix){
  const W = Math.max(280, host.clientWidth || 320), H = 176;
  const pad = { l:32, r:10, t:14, b:26 };
  const iw = W-pad.l-pad.r, ih = H-pad.t-pad.b;
  const band = iw/months.length;
  const barW = Math.max(6, Math.min(24, band-10));
  let s='';
  for(const t of [0,50,100]){
    const yy = pad.t + ih - (t/100)*ih;
    s+=`<line class="grid" x1="${pad.l}" x2="${W-pad.r}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}"/>`;
    s+=`<text x="${pad.l-6}" y="${(yy+3.5).toFixed(1)}" text-anchor="end">${t}%</text>`;
  }
  s+=`<line class="axis" x1="${pad.l}" x2="${W-pad.r}" y1="${pad.t+ih}" y2="${pad.t+ih}"/>`;
  months.forEach((m,n)=>{
    const cx = pad.l + band*n + band/2;
    const col = matrix[n], total = col.reduce((a,b)=>a+b,0);
    if(total>0){
      const segs = col.map((v,k)=>({ v, k })).filter(o=>o.v>0);
      let acc=0;
      segs.forEach((o,si)=>{
        const frac=o.v/total;
        const hFull = frac*ih;
        const yTop = pad.t + ih - (acc+frac)*ih;
        const isLast = si===segs.length-1;
        const h = Math.max(1, hFull - (isLast?0:2));   // 2pxのサーフェスギャップ（最上段は削らない）
        const r = isLast ? 4 : 0;
        s+=`<path d="${barPath(cx-barW/2, yTop, barW, h, r)}" fill="${cats[o.k].color}"/>`;
        acc+=frac;
      });
    }
    const lab = (n===0 || m.slice(5)==='01') ? `${m.slice(2,4)}/${m.slice(5)}` : fmtMonthLabel(m);
    s+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${svgEsc(lab)}</text>`;
    s+=`<rect class="band" x="${pad.l+band*n}" y="${pad.t}" width="${band}" height="${ih}" tabindex="0"
        data-n="${n}" role="img" aria-label="${svgEsc(fmtYM(m))} ${cats.map((c,k)=>c.label+col[k]+'件').join(' ')}"/>`;
  });
  host.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="group">${s}</svg>`;
  host.querySelectorAll('.band').forEach(b=>{
    const n=+b.dataset.n, col=matrix[n], total=col.reduce((a,x)=>a+x,0);
    const rows=cats.map((c,k)=>({ label:c.label, color:c.color,
      value: total? `${col[k]}件 ${Math.round(col[k]/total*100)}%` : '0件' })).filter((r,k)=>col[k]>0);
    const show=ev=>showTip(ev, `${fmtYM(months[n])}（${total}件）`, rows.length?rows:[{label:'データなし',color:'transparent',value:''}]);
    b.addEventListener('pointerenter',show); b.addEventListener('pointermove',show); b.addEventListener('focus',show);
    b.addEventListener('pointerleave',hideTip); b.addEventListener('blur',hideTip);
  });
}
function legendHtml(series, kind){
  return `<div class="legend">` + series.map(s=>
    `<span><i class="${kind==='line'?'ln':''}" style="background:${s.color}"></i>${esc(s.label)}</span>`).join('') + `</div>`;
}
function tableHtml(head, rows){
  return `<details class="fold"><summary>表で見る</summary><div class="tscroll"><table class="dt">
    <thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${r.map((c,n)=>n===0?`<th scope="row" style="font-weight:400">${esc(c)}</th>`:`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div></details>`;
}

/* ============================================================================
   推移ビュー
   ========================================================================== */
function addMonth(m, d){
  let y=+m.slice(0,4), mo=+m.slice(5,7)+d;
  y += Math.floor((mo-1)/12); mo = ((mo-1)%12+12)%12+1;
  return `${y}-${pad2(mo)}`;
}
function fillMonths(from, to){
  const out=[]; let c=from, guard=0;
  while(c<=to && guard++<600){ out.push(c); c=addMonth(c,1); }
  return out;
}
function initialMonth(){
  const inits=live().filter(i=>i.source==='initial').map(i=>monthOf(i.createdAt)).filter(Boolean).sort();
  return inits[0]||null;
}
function allMonths(){
  const ms=new Set();
  for(const i of live()){
    if(i.source!=='initial' && monthOf(i.createdAt)) ms.add(monthOf(i.createdAt));
    if(i.done && monthOf(i.doneAt)) ms.add(monthOf(i.doneAt));
  }
  const init=initialMonth(); if(init) ms.add(init);
  ms.add(monthOf(nowISO()));
  const a=Array.from(ms).sort();
  return fillMonths(a[0], a[a.length-1]);
}
function rangeMonths(){
  const all=allMonths();
  const n = S.range==='all' ? all.length : +S.range;
  return all.slice(Math.max(0, all.length-n));
}
function topCategories(limit){
  const cnt=new Map();
  for(const i of live()){ const c=i.category||'（未分類）'; cnt.set(c,(cnt.get(c)||0)+1); }
  const sorted=Array.from(cnt.entries()).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ja'));
  const top=sorted.slice(0,limit).map(e=>e[0]);
  return { top, hasOther: sorted.length>limit };
}
function renderTrend(){
  const box=$('#trend-out');
  const months=rangeMonths();
  const all=live();
  const initN=all.filter(i=>i.source==='initial').length;
  const initM=initialMonth();
  const appItems=all.filter(i=>i.source!=='initial');

  /* KPI */
  const thisM=monthOf(nowISO());
  const kpi=[
    ['総数', all.length, `うち初期 ${initN}件`],
    ['完了', all.filter(i=>i.done).length, `完了率 ${all.length?Math.round(all.filter(i=>i.done).length/all.length*100):0}%`],
    ['着手中', all.filter(i=>i.status==='doing').length, '動き出しているもの'],
    ['今月の追加', appItems.filter(i=>monthOf(i.createdAt)===thisM).length, 'アプリからの追加のみ'],
  ];
  let html = `<div class="kpis">` + kpi.map(([l,v,d])=>
    `<div class="card kpi"><div class="l">${esc(l)}</div><div class="v">${v}</div><div class="d">${esc(d)}</div></div>`).join('') + `</div>`;

  /* 1) 月別 追加数・完了数 */
  const added = months.map(m=>appItems.filter(i=>monthOf(i.createdAt)===m).length);
  const doneA = months.map(m=>all.filter(i=>i.done && monthOf(i.doneAt)===m).length);
  const s1 = { key:'added', label:'追加', color:cssVar('--s1'), values:added };
  const s2 = { key:'done',  label:'完了', color:cssVar('--s2'), values:doneA };
  html += `<div class="viz">
    <div class="viz-h"><h3>月別の追加数・完了数</h3></div>
    <p class="viz-note">初期一括登録の <b>${initN}件</b>（${initM?fmtYM(initM):'—'}）は追加数の推移から除外。スタート時点の基準線として上の「総数」に含めています。</p>
    <div class="card viz-box"><div id="ch1"></div>${legendHtml([s1,s2])}</div>
    ${tableHtml(['月','追加','完了'], months.map((m,n)=>[fmtYM(m), String(added[n]), String(doneA[n])]))}
  </div>`;

  /* 2) お金の区分の構成比 推移（その月末時点で存在する項目の内訳） */
  const moneyCats = MONEY_STACK.map((k,n)=>({
    key:k, label:k?MONEY[k].short:'未設定',
    color: k ? cssVar(MONEY[k].varName) : cssVar(NEUTRAL_VAR) }));
  const existsAt = m => all.filter(i=>monthOf(i.createdAt) <= m);
  const mMatrix = months.map(m=>{
    const pool=existsAt(m);
    return MONEY_STACK.map(k=> pool.filter(i=>(i.money||'')===k).length );
  });
  html += `<div class="viz">
    <div class="viz-h"><h3>お金の区分の構成比</h3></div>
    <p class="viz-note">各月末時点で持っている項目の内訳。区分は後から変えられるので、いまの値で塗り直されます。</p>
    <div class="card viz-box"><div id="ch2"></div>${legendHtml(moneyCats)}</div>
    ${tableHtml(['月',...moneyCats.map(c=>c.label),'合計'],
      months.map((m,n)=>[fmtYM(m), ...mMatrix[n].map(String), String(mMatrix[n].reduce((a,b)=>a+b,0))]))}
  </div>`;

  /* 3) カテゴリ構成比 推移（上位7＋その他） */
  const { top, hasOther } = topCategories(7);
  const catCats = top.map((c,n)=>({ key:c, label:c, color:cssVar(SERIES_VARS[n]) }));
  if(hasOther) catCats.push({ key:'__other', label:'その他', color:cssVar(NEUTRAL_VAR) });
  const cMatrix = months.map(m=>{
    const pool=existsAt(m);
    const row=catCats.map(c=> c.key==='__other' ? 0 : pool.filter(i=>(i.category||'（未分類）')===c.key).length );
    if(hasOther) row[row.length-1] = pool.length - row.reduce((a,b)=>a+b,0);
    return row;
  });
  html += `<div class="viz">
    <div class="viz-h"><h3>カテゴリの構成比</h3></div>
    <p class="viz-note">上位7カテゴリ＋その他。色は8つが上限なので、9つ目からは「その他」にまとめています。</p>
    <div class="card viz-box"><div id="ch3"></div>${legendHtml(catCats)}</div>
    ${tableHtml(['月',...catCats.map(c=>c.label)],
      months.map((m,n)=>[fmtYM(m), ...cMatrix[n].map(String)]))}
  </div>`;

  box.innerHTML = html;
  drawColumns($('#ch1'), months, [s1,s2]);
  drawStack100($('#ch2'), months, moneyCats, mMatrix);
  drawStack100($('#ch3'), months, catCats, cMatrix);
}

        <header class="paper-h">
          <div class="pd"><b>${+d.slice(5,7)}</b><span>月</span><b>${+d.slice(8,10)}</b><span>日</span></div>
          <div class="pt">
            <h3>${esc(title.replace(/^\d{4}-\d{2}-\d{2}\s*/,''))}</h3>
            <p>${d.slice(0,4)}年 ・ 対象 ${esc(a.periodFrom||'—')} 〜 ${esc(a.periodTo||'—')}</p>
          </div>
        </header>
        <div class="paper-b${n===0?'':' clipped'}">
          <div class="md">${mdToHtml(a.summary.replace(/^#\s+.+\n/,''))}</div>
        </div>
        ${n===0?'':'<button class="more" type="button">つづきを読む</button>'}
      </article>`;
    }).join('');
    $$('#log-out article.paper').forEach(art=>{
      const body=art.querySelector('.paper-b');
      const heads=Array.from(art.querySelectorAll('.md h2'));
      if(heads.length>=3){
        const nav=document.createElement('details'); nav.className='toc';
        const sum=document.createElement('summary'); sum.textContent=`目次（${heads.length}）`;
        nav.appendChild(sum);

          a.addEventListener('click', e=>{ e.preventDefault(); nav.open=false; h.scrollIntoView({behavior:'smooth', block:'start'}); });
          li.appendChild(a); ol.appendChild(li);
        });
        nav.appendChild(ol);
        body.insertBefore(nav, body.firstChild);
      }

      if(more) more.addEventListener('click', ()=>{ body.classList.remove('clipped'); more.remove(); });
    });
  }
}

/* ---------- 最小Markdownレンダラ（先にエスケープしてから変換） ---------- */
function mdInline(t){
  return t
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}
function mdToHtml(src){
  const lines = esc(String(src||'')).replace(/\r\n?/g,'\n').split('\n');
  let out=[], i=0;
  const flushP=buf=>{ if(buf.length){ out.push('<p>'+mdInline(buf.join('<br>'))+'</p>'); buf.length=0; } };
  let p=[];
  while(i<lines.length){
    const L=lines[i];
    if(/^```/.test(L)){
      flushP(p); const body=[]; i++;
      while(i<lines.length && !/^```/.test(lines[i])) body.push(lines[i++]);
      i++; out.push('<pre><code>'+body.join('\n')+'</code></pre>'); continue;
    }
    if(/^\s*$/.test(L)){ flushP(p); i++; continue; }
    let m;
    if((m=L.match(/^(#{1,4})\s+(.*)$/))){ flushP(p); const n=Math.min(3,m[1].length); out.push(`<h${n}>${mdInline(m[2])}</h${n}>`); i++; continue; }
    if(/^\s*(---|\*\*\*|___)\s*$/.test(L)){ flushP(p); out.push('<hr>'); i++; continue; }
    if(/^&gt;\s?/.test(L)){
      flushP(p); const body=[];
      while(i<lines.length && /^&gt;\s?/.test(lines[i])) body.push(lines[i++].replace(/^&gt;\s?/,''));
      out.push('<blockquote>'+mdInline(body.join('<br>'))+'</blockquote>'); continue;
    }
    if(/^\s*\|.*\|\s*$/.test(L) && i+1<lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      flushP(p);
      const cells=s=>s.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const head=cells(lines[i]); i+=2; const rows=[];
      while(i<lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(cells(lines[i++]));
      out.push('<div class="mdtable"><table><thead><tr>'+head.map(h=>`<th>${mdInline(h)}</th>`).join('')+'</tr></thead><tbody>'
        + rows.map(r=>'<tr>'+r.map(c=>`<td>${mdInline(c)}</td>`).join('')+'</tr>').join('')+'</tbody></table></div>');
      continue;
    }
    if(/^\s*([-*+])\s+/.test(L) || /^\s*\d+[.)]\s+/.test(L)){
      flushP(p);
      const ordered=/^\s*\d+[.)]\s+/.test(L);
      const tag=ordered?'ol':'ul', items=[];
      const re = ordered ? /^\s*\d+[.)]\s+/ : /^\s*([-*+])\s+/;
      while(i<lines.length && re.test(lines[i])) items.push(lines[i++].replace(re,''));
      out.push(`<${tag}>`+items.map(t=>`<li>${mdInline(t)}</li>`).join('')+`</${tag}>`);
      continue;
    }
    p.push(L); i++;
  }
  flushP(p);
  return out.join('\n');
}

/* ============================================================================
   データビュー: インポート / エクスポート / 表示設定
   ========================================================================== */
function buildExport(){
  return {
    schemaVersion: SCHEMA_VERSION,
    exportedAt: nowISO(),
    items: S.items.slice().sort((a,b)=>a.createdAt.localeCompare(b.createdAt)),
    analyses: S.analyses.slice().sort((a,b)=>a.createdAt.localeCompare(b.createdAt)),
  };
}
function exportName(){
  const d=new Date();
  return `yaritai-list-${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}-${pad2(d.getHours())}${pad2(d.getMinutes())}.json`;
}
function doExport(){
  const json=JSON.stringify(buildExport(), null, 2);
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=exportName();
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  toast(`${exportName()} を書き出しました`);
}
function previewImport(text){
  let data;
  try{ data=JSON.parse(text); }
  catch(e){ toast('JSONとして読めませんでした'); return; }
  if(!data || typeof data!=='object' || (!Array.isArray(data.items) && !Array.isArray(data.analyses))){
    toast('items / analyses が見つかりません'); return;
  }
  const res = mergeData(S.items, S.analyses, data);
  S.pendingImport = { data, res };
  const st=res.stats;
  const warn = data.schemaVersion && data.schemaVersion!==SCHEMA_VERSION
    ? `<div class="prev"><span class="warn">schemaVersion が ${esc(String(data.schemaVersion))}（このアプリは ${SCHEMA_VERSION}）</span><span></span></div>` : '';
  openSheet(`
    <div class="sheet-h"><h3>取り込みの確認</h3><button class="btn ghost sm" data-x="close">閉じる</button></div>
    <div class="sheet-b">
      <p style="margin:0 0 12px; color:var(--muted); font-size:12.5px">マージ規則（id突き合わせ・updatedAtが新しい方を採用・historyは統合・削除は復活させない）で統合します。</p>
      <div class="prev">
        <span>新しく追加される項目</span><span class="n">${st.added}</span>
        <span>更新される項目</span><span class="n">${st.updated}</span>
        <span>変更なし</span><span class="n">${st.same}</span>
        <span>削除のまま維持</span><span class="n">${st.keptDeleted}</span>
        <span>追加される分析</span><span class="n">${st.analysesAdded}</span>
        ${st.analysesUpdated?`<span>書き直された分析</span><span class="n">${st.analysesUpdated}</span>`:''}
        ${st.skipped?`<span class="warn">読めずに飛ばす行</span><span class="n warn">${st.skipped}</span>`:''}
      </div>
      ${warn}
      <hr class="hr" style="margin:14px 0">
      <div class="prev">
        <span>取り込み後の総数</span><span class="n">${res.items.filter(i=>!i.deletedAt).length}</span>
        <span>いまの総数</span><span class="n">${live().length}</span>
      </div>
    </div>
    <div class="sheet-f">
      <span style="flex:1"></span>
      <button class="btn" data-x="close">やめる</button>
      <button class="btn primary" data-x="apply" data-autofocus>取り込む</button>
    </div>`, sh=>{
    sh.addEventListener('click', e=>{
      const b=e.target.closest('[data-x]'); if(!b) return;
      if(b.dataset.x==='close'){ S.pendingImport=null; closeSheet(); }
      if(b.dataset.x==='apply') applyImport();
    });
  });
}
async function applyImport(){
  if(!S.pendingImport) return;
  const { res } = S.pendingImport;
  S.items = res.items; S.analyses = res.analyses;
  S.pendingImport = null;
  try{
    await idbReplaceAll('items', S.items);
    await idbReplaceAll('analyses', S.analyses);
  }catch(e){ dbErr(e); }
  closeSheet(); renderAll();
  toast(`取り込み完了（${live().length}件・分析${S.analyses.length}件）`);
}

  $('#data-out').innerHTML = `
  <div class="card" style="margin-bottom:16px">

      <button class="btn primary sm" data-d="export">書き出す</button></div>
    <div class="drow"><div class="dl"><b>インポート（ファイル）</b><span>master.json でも、書き出したJSONでも。件数をプレビューしてから確定します。</span></div>

    <div class="drow"><div class="dl"><b>インポート（貼り付け）</b><span>iPhoneでファイルを扱いにくいときは、JSONをそのまま貼り付け。</span></div>

  </div>

  <div class="card" style="margin-bottom:16px">
