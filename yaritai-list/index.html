      <div class="seg"><button type="button" data-p="0" aria-pressed="${!S.pub}">ふつう</button><button type="button" data-p="1" aria-pressed="${S.pub}">公開</button></div></div>
    <div class="drow"><div class="dl"><b>テーマ</b><span>端末ごとの設定。データには入りません。</span></div>
      <div class="seg">${[['auto','自動'],['light','ライト'],['dark','ダーク']].map(([v,l])=>
        `<button type="button" data-th="${v}" aria-pressed="${S.theme===v}">${l}</button>`).join('')}</div></div>
  </div>

  <div class="card pad" style="margin-bottom:16px">
    <div class="prev" style="font-size:13px">
      <span>項目</span><span class="n">${all.length}</span>
      <span>うち完了</span><span class="n">${all.filter(i=>i.done).length}</span>
      <span>うち着手中</span><span class="n">${all.filter(i=>i.status==='doing').length}</span>
      <span>お金を出してでも</span><span class="n">${all.filter(i=>i.money==='pay').length}</span>
      <span>そこまでは出さない</span><span class="n">${all.filter(i=>i.money==='hold').length}</span>
      <span>お金はかからない</span><span class="n">${all.filter(i=>i.money==='none').length}</span>
      <span>お金 未設定</span><span class="n">${all.filter(i=>i.money===null).length}</span>
      <span>論理削除ぶん（エクスポートに含む）</span><span class="n">${S.items.length-all.length}</span>
      <span>分析</span><span class="n">${S.analyses.length}</span>
      <span>最終更新</span><span class="n">${esc(last?String(last).slice(0,16).replace('T',' '):'—')}</span>
    </div>
  </div>

  <div class="card pad" style="margin-bottom:16px">
    <details class="fold"><summary>キーボードショートカット</summary>
      <div class="klist" style="margin-top:10px">
        <span class="kk"><kbd>n</kbd></span><span>追加欄にカーソル</span>
        <span class="kk"><kbd>/</kbd></span><span>検索</span>
        <span class="kk"><kbd>r</kbd></span><span>今日なにする？</span>
        <span class="kk"><kbd>l</kbd> <kbd>t</kbd> <kbd>c</kbd> <kbd>g</kbd> <kbd>d</kbd></span><span>一覧 / 仕分け / 推移 / 記録 / データ</span>
        <span class="kk"><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd></span><span>仕分け: 出してでも / そこまでは出さない / かからない</span>
        <span class="kk"><kbd>s</kbd></span><span>仕分け: スキップ</span>
        <span class="kk">スワイプ</span><span>右で完了 / 左で着手中（一覧）</span>
        <span class="kk"><kbd>p</kbd></span><span>公開モード切替</span>
        <span class="kk"><kbd>⌘</kbd>+<kbd>Enter</kbd></span><span>詳細シートを保存</span>
        <span class="kk"><kbd>Esc</kbd></span><span>閉じる</span>
      </div>
    </details>
  </div>

  <div class="card pad">
    <details class="fold"><summary>この端末のデータを全部消す</summary>
      <p style="font-size:12.5px; color:var(--muted); margin:8px 0 10px">
        消えるのはこの端末のブラウザ内（IndexedDB）だけです。正本はローカルの master.json 側にあります。先にエクスポートを。</p>
      <button class="btn danger sm" data-d="wipe">全部消す</button>
    </details>
  </div>`;
}
function bindData(){
  $('#data-out').addEventListener('click', async e=>{
    const b=e.target.closest('[data-d],[data-p],[data-th]'); if(!b) return;
    if(b.dataset.p!=null){ S.pub=b.dataset.p==='1'; applyTheme(); savePrefs(); renderData(); return; }
    if(b.dataset.th){ S.theme=b.dataset.th; applyTheme(); savePrefs(); renderData();
      if(S.view==='trend') renderTrend(); return; }
    const d=b.dataset.d;
    if(d==='export') doExport();
    if(d==='import') $('#file-in').click();
    if(d==='paste') pasteImport();
    if(d==='wipe'){
      if(!confirm('この端末のブラウザ内のデータを全部消します。よろしいですか？')) return;
      if(!confirm('本当に消しますか？（エクスポートは済んでいますか）')) return;
      S.items=[]; S.analyses=[];
      try{ await idbReplaceAll('items',[]); await idbReplaceAll('analyses',[]); }catch(err){ dbErr(err); }
      renderAll(); toast('消しました');
    }
  });
  $('#file-in').addEventListener('change', async e=>{
    const f=e.target.files && e.target.files[0]; if(!f) return;
    try{ previewImport(await f.text()); }catch(err){ toast('ファイルを読めませんでした'); }
    e.target.value='';
  });
}
function pasteImport(){
  openSheet(`
    <div class="sheet-h"><h3>JSONを貼り付け</h3><button class="btn ghost sm" data-x="close">閉じる</button></div>
    <div class="sheet-b"><textarea id="p-json" rows="9" placeholder='{"schemaVersion":1,"items":[...]}' data-autofocus></textarea></div>
    <div class="sheet-f"><span style="flex:1"></span><button class="btn" data-x="close">やめる</button>
      <button class="btn primary" data-x="go">読み込む</button></div>`, sh=>{
    sh.addEventListener('click', e=>{
      const b=e.target.closest('[data-x]'); if(!b) return;
      if(b.dataset.x==='close') closeSheet();
      if(b.dataset.x==='go'){ const t=sh.querySelector('#p-json').value; closeSheet(); setTimeout(()=>previewImport(t), 320); }
    });
  });
}

/* ============================================================================
   ルーティングと描画
   ========================================================================== */
const VIEWS = ['list','triage','trend','log','data'];
function go(view){
  if(!VIEWS.includes(view)) view='list';
  S.view=view;
  for(const v of VIEWS) $('#v-'+v).hidden = (v!==view);
  $$('nav.tabs button').forEach(b=>{
    if(b.dataset.go===view) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  window.scrollTo({top:0});
  renderCurrent();
}
function renderCurrent(){
  refreshCatColors();
  if(S.view==='list')   renderList();
  if(S.view==='triage') renderTriage();
  if(S.view==='trend')  renderTrend();
  if(S.view==='log')    renderLog();
  if(S.view==='data')   renderData();
}
function renderAll(){ renderCurrent(); if(S.view!=='list') renderList(); }

/* ---------- 入力の結線 ---------- */
function bindChrome(){
  document.addEventListener('click', e=>{
    const g=e.target.closest('[data-go]'); if(g){ go(g.dataset.go); return; }
    const lt=e.target.closest('[data-lt]'); if(lt){ S.logTab=lt.dataset.lt; savePrefs(); renderLog(); return; }
    const tr=e.target.closest('#t-range [data-r]'); if(tr){ S.range=tr.dataset.r; savePrefs(); renderTrend(); return; }
    const md=e.target.closest('[data-mode]'); if(md){ S.mode=md.dataset.mode; savePrefs(); renderList(); return; }
  });
  $('#scrim').addEventListener('click', ()=>closeSheet());
  $('#btn-random').addEventListener('click', randomPick);
  $('#btn-theme').addEventListener('click', ()=>{
    S.theme = S.theme==='auto' ? 'light' : S.theme==='light' ? 'dark' : 'auto';
    applyTheme(); savePrefs();
    toast(`テーマ: ${{auto:'自動（端末に合わせる）',light:'ライト',dark:'ダーク'}[S.theme]}`);
    if(S.view==='trend') renderTrend(); if(S.view==='data') renderData();
  });
  $('#qadd').addEventListener('submit', e=>{
    e.preventDefault();
    const inp=$('#q-title'), t=inp.value.trim();
    if(!t) return;
    const it=addItem(t);
    inp.value=''; inp.focus();
    renderAll();
    if(it) toast('追加しました', '詳しく書く', ()=>openDetail(it.id));
  });
  $('#f-toggle').addEventListener('click', ()=>{
    S.filterOpen = !($('#f-more').hidden===false);
    savePrefs(); applyFilterUI();
    if(!$('#f-more').hidden) $('#f-status').focus();
  });
  const onF=()=>{ S.f.q=$('#f-q').value;
    S.sort=$('#f-sort').value; S.group=$('#f-group').value; savePrefs(); renderList(); };
  $('#f-cat').addEventListener('click', e=>{
    const b=e.target.closest('[data-cat]'); if(!b) return;
    const v=b.dataset.cat;
    if(v===''){ S.f.cat=[]; }
    else { const i=S.f.cat.indexOf(v); if(i<0) S.f.cat.push(v); else S.f.cat.splice(i,1); }
    savePrefs(); renderList();
  });
  $('#f-status').addEventListener('click', e=>{
    const b=e.target.closest('[data-v]'); if(!b) return;
    S.f.status=b.dataset.v; savePrefs(); renderList(); });
  $('#f-money').addEventListener('click', e=>{
    const b=e.target.closest('[data-v]'); if(!b) return;
    S.f.money=b.dataset.v; savePrefs(); renderList(); });
  ['f-q','f-sort','f-group'].forEach(id=>{
    const el=$('#'+id); el.addEventListener('change', onF);
    if(id==='f-q') el.addEventListener('input', onF);
  });
  $('#t-range').innerHTML = [['6','直近6ヶ月'],['12','直近12ヶ月'],['all','全期間']]
    .map(([v,l])=>`<button type="button" data-r="${v}" aria-pressed="${S.range===v}">${l}</button>`).join('');
  let rt=null;
  window.addEventListener('resize', ()=>{ clearTimeout(rt); rt=setTimeout(()=>{ if(S.view==='trend') renderTrend(); }, 220); });
  window.addEventListener('scroll', hideTip, {passive:true});
}
function bindKeys(){
  document.addEventListener('keydown', e=>{
    const t=e.target, typing = t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable);
    if(e.key==='Escape'){
      if(sheetCloser){ closeSheet(); return; }
      if(typing && t.id==='f-q'){ $('#f-q').value=''; S.f.q=''; renderList(); t.blur(); return; }
      if(typing) t.blur();
      return;
    }
    if(typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if(sheetCloser) return;
    const k=e.key;
    if(k==='n'){ e.preventDefault(); go('list'); $('#q-title').focus(); return; }
    if(k==='/'){ e.preventDefault(); go('list'); $('#f-q').focus(); return; }
    if(k==='r'){ e.preventDefault(); randomPick(); return; }
    if(k==='p'){ S.pub=!S.pub; applyTheme(); savePrefs(); renderCurrent(); toast(S.pub?'公開モード: オン':'公開モード: オフ'); return; }
    if(k==='l'){ go('list'); return; }
    if(k==='t'){ go('triage'); return; }
    if(k==='c'){ go('trend'); return; }
    if(k==='g'){ go('log'); return; }
    if(k==='d'){ go('data'); return; }
    if(S.view==='triage'){
      if(k==='1'||k==='2'||k==='3'){ e.preventDefault(); triageAct(k); return; }
      if(k==='s'){ e.preventDefault();
        const q=live().filter(i=>i.money===null); const i=q[0];
        if(i){ S.items=S.items.filter(x=>x!==i).concat([i]); renderTriage(); } return; }
      if(k==='u'){ e.preventDefault();
        if(S.lastTriage){ const l=S.lastTriage;
          updateItem(l.id,{money:l.money},{silent:true}); S.lastTriage=null; renderAll(); } return; }
    }
  });
}

/* ============================================================================
   起動
   ========================================================================== */
async function boot(){
  const p=loadPrefs();
  if(p.theme) S.theme=p.theme;
  if(typeof p.pub==='boolean') S.pub=p.pub;
  if(p.f) Object.assign(S.f, p.f);
  if(!Array.isArray(S.f.cat)) S.f.cat = S.f.cat ? [S.f.cat] : [];   // 旧prefs（単一選択）からの移行
  if(p.sort) S.sort=p.sort;
  if(p.group) S.group=p.group;
  if(p.range) S.range=p.range;
  if(p.logTab) S.logTab=p.logTab;
  if(typeof p.filterOpen==='boolean') S.filterOpen=p.filterOpen;
  if(p.mode==='board'||p.mode==='list') S.mode=p.mode;
  if(!STATUS_KEYS.includes(S.f.status) && S.f.status!=='all') S.f.status='all';  // 旧prefs（open）から
  /* URLでの上書き（共有リンク・検証用）: ?theme=dark / #trend */
  try{
    const sp=new URLSearchParams(location.search);
    const th=sp.get('theme');
    if(th==='auto'||th==='light'||th==='dark') S.theme=th;
    if(sp.get('pub')==='1') S.pub=true;
    const lg=sp.get('log'); if(lg==='timeline'||lg==='analyses') S.logTab=lg;
    const md=sp.get('mode'); if(md==='list'||md==='board') S.mode=md;
    const h=decodeURIComponent(location.hash).replace('#','');
    if(VIEWS.includes(h)) S.view=h;
  }catch(e){}
  applyTheme();
  /* 先に画面を出す。データ読み込みが詰まっても白紙にしない */
  bindChrome(); bindListGestures(); bindBoard(); bindTriage(); bindData(); bindKeys();
  go(S.view);
  const withTimeout = (p, ms) => Promise.race([p,
    new Promise((_,rej)=>setTimeout(()=>rej(new Error('IndexedDB timeout')), ms))]);
  try{
    db = await withTimeout(openDB(), 5000);
    S.items    = (await withTimeout(idbAll('items'), 5000)).map(normalizeItem).filter(Boolean);
    S.analyses = (await withTimeout(idbAll('analyses'), 5000)).map(normalizeAnalysis).filter(Boolean);
    renderAll();
  }catch(e){
    dbBroken=true; db=null; console.warn('IndexedDB unavailable:', e);
    renderAll();
    toast('この端末では保存できません（プライベートモード？）。エクスポートで持ち出せます');
  }
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
  /* テスト用フック（?selftest=1 のときだけ読み込む） */
  window.YL = { S, normalizeItem, normalizeAnalysis, mergeData, mergeItem, unionHistory, buildExport,
    addItem, updateItem, setDone, setStatus, progress, softDelete, live, byId, renderAll, go, idbReplaceAll,
    allMonths, rangeMonths, topCategories, mdToHtml, applyImport,
    importJSON: async text => { const data=JSON.parse(text);
      const res=mergeData(S.items,S.analyses,data); S.items=res.items; S.analyses=res.analyses;
      await idbReplaceAll('items',S.items); await idbReplaceAll('analyses',S.analyses);
      renderAll(); return res.stats; } };
  if(/[?&]selftest=1/.test(location.search)){
    const s=document.createElement('script'); s.src='selftest.js'; document.body.appendChild(s);
  }
}
document.addEventListener('DOMContentLoaded', boot);
</script>
