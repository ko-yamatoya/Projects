<!DOCTYPE html>
<html lang="ja" data-theme="auto" data-font="m">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>幹事ノート</title>
<meta name="description" content="スポーツの集まりの出欠・ご飯の注文・参加費の集金を、日付と種目ごとに管理する幹事さん用アプリ。">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="幹事ノート">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* ============================================================
   tokens — iOS のシステムカラーに寄せた配色
   文字色はiOS標準より少しだけ濃くして、小さい文字でも読める濃さ
   （コントラスト4.5以上）にしている。
   data-theme=auto のときだけ OS の設定に従う。
   文字の大きさは data-font（m / l / xl）で html の font-size を変え、
   すべて rem で組んでいるので画面全体が一緒に大きくなる。
   ============================================================ */
:root{
  color-scheme:light;
  --bg:#f2f2f7; --cell:#ffffff; --cell-2:#f2f2f7;
  --fill:rgba(118,118,128,.12); --fill-2:rgba(118,118,128,.2); --hl:rgba(0,0,0,.06);
  --label:#000000; --label-2:#6d6d72; --label-3:#aeaeb2; --tabgray:#7d7d82;
  --sep:rgba(60,60,67,.18);
  --tint:#0a6cff; --tint-bg:#0a6cff; --on-tint:#ffffff; --tint-soft:rgba(10,108,255,.12);
  --green:#248a3d; --on-green:#ffffff; --green-soft:rgba(52,199,89,.17); --green-text:#1b7a33; --switch:#34c759;
  --yellow:#a05a00; --on-yellow:#ffffff; --yellow-soft:rgba(255,204,0,.24); --yellow-text:#8a4d00;
  --orange:#c24e00; --on-orange:#ffffff; --orange-soft:rgba(255,149,0,.17); --orange-text:#a94300;
  --red:#d70015; --on-red:#ffffff; --red-soft:rgba(255,59,48,.12); --red-text:#c4000f; --today:#ff3b30;
  --gray:#636366; --on-gray:#ffffff;
  --seg-on:#ffffff; --seg-accent:#0a6cff; --star:#e08600;
  --lg:#05803e; --on-lg:#ffffff;
  --bar:rgba(249,249,249,.86); --bar-sep:rgba(0,0,0,.2);
  --key:#e5e5ea;
  --tape:#d9c49c; --tape-ink:#2b2418;
  --focus:#0a6cff;
  --r-cell:12px; --r-card:14px; --r-btn:12px;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,system-ui,sans-serif;
  --round:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","Rounded Mplus 1c","Kosugi Maru",var(--sans);
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --bg:#000000; --cell:#1c1c1e; --cell-2:#2c2c2e;
    --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.34); --hl:rgba(255,255,255,.08);
    --label:#ffffff; --label-2:#98989f; --label-3:#5d5d62; --tabgray:#8e8e93;
    --sep:rgba(84,84,88,.6);
    --tint:#0a84ff; --tint-bg:#0071e3; --on-tint:#ffffff; --tint-soft:rgba(10,132,255,.2);
    --green:#30d158; --on-green:#002b0e; --green-soft:rgba(48,209,88,.18); --green-text:#30d158; --switch:#30d158;
    --yellow:#ffd60a; --on-yellow:#2b2300; --yellow-soft:rgba(255,214,10,.17); --yellow-text:#ffd60a;
    --orange:#ff9f0a; --on-orange:#2b1700; --orange-soft:rgba(255,159,10,.2); --orange-text:#ffb340;
    --red:#ff453a; --on-red:#2b0300; --red-soft:rgba(255,69,58,.2); --red-text:#ff6961; --today:#ff453a;
    --gray:#8e8e93; --on-gray:#000000;
    --seg-on:#636366; --seg-accent:#ffffff; --star:#ffb340;
    --lg:#30d158; --on-lg:#002b0e;
    --bar:rgba(22,22,24,.86); --bar-sep:rgba(255,255,255,.16);
    --key:#333336;
    --tape:#cdb588; --tape-ink:#211a0e;
    --focus:#0a84ff;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000000; --cell:#1c1c1e; --cell-2:#2c2c2e;
  --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.34); --hl:rgba(255,255,255,.08);
  --label:#ffffff; --label-2:#98989f; --label-3:#5d5d62; --tabgray:#8e8e93;
  --sep:rgba(84,84,88,.6);
  --tint:#0a84ff; --tint-bg:#0071e3; --on-tint:#ffffff; --tint-soft:rgba(10,132,255,.2);
  --green:#30d158; --on-green:#002b0e; --green-soft:rgba(48,209,88,.18); --green-text:#30d158; --switch:#30d158;
  --yellow:#ffd60a; --on-yellow:#2b2300; --yellow-soft:rgba(255,214,10,.17); --yellow-text:#ffd60a;
  --orange:#ff9f0a; --on-orange:#2b1700; --orange-soft:rgba(255,159,10,.2); --orange-text:#ffb340;
  --red:#ff453a; --on-red:#2b0300; --red-soft:rgba(255,69,58,.2); --red-text:#ff6961; --today:#ff453a;
  --gray:#8e8e93; --on-gray:#000000;
  --seg-on:#636366; --seg-accent:#ffffff; --star:#ffb340;
  --lg:#30d158; --on-lg:#002b0e;
  --bar:rgba(22,22,24,.86); --bar-sep:rgba(255,255,255,.16);
  --key:#333336;
  --tape:#cdb588; --tape-ink:#211a0e;
  --focus:#0a84ff;
}

/* ============================================================ base */
*{box-sizing:border-box}
[hidden]{display:none !important}
html{font-size:100%; -webkit-text-size-adjust:100%; text-size-adjust:100%}
html[data-font="l"]{font-size:112.5%}
html[data-font="xl"]{font-size:125%}
body{
  margin:0; background:var(--bg); color:var(--label);
  font-family:var(--sans); font-size:1.0625rem; line-height:1.5; letter-spacing:.01em;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; overflow-wrap:anywhere;
}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit; color:inherit; letter-spacing:inherit}
button{cursor:pointer; touch-action:manipulation}
a{color:var(--tint)}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
svg{display:block}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.muted{color:var(--label-2)}
.small{font-size:.875rem}
.num{font-variant-numeric:tabular-nums}
.grow{flex:1; min-width:0}
.center{text-align:center}
.mt{margin-top:.8rem}

/* ============================================================ navigation bar（上） */
.top{position:sticky; top:0; z-index:20; padding-top:env(safe-area-inset-top); background:var(--bg); transition:background-color .2s, box-shadow .2s}
.top.scrolled, .top.solid{background:var(--bar); -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px); box-shadow:0 .5px 0 var(--bar-sep)}
.top-in{max-width:44rem; margin:0 auto; height:2.9rem; padding:0 .4rem; display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:.25rem}
.top .l{justify-self:start; min-width:0; display:flex}
.top .r{justify-self:end; display:flex; align-items:center; gap:.1rem}
.top .t{font-size:1.0625rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:58vw; opacity:0; transition:opacity .2s; text-align:center}
.top.scrolled .t, .top.solid .t{opacity:1}
.navbtn{display:inline-flex; align-items:center; gap:.05rem; min-height:2.75rem; min-width:2.75rem; justify-content:center; padding:0 .45rem; border:0; background:none; color:var(--tint); font-size:1.0625rem; text-decoration:none; white-space:nowrap}
.navbtn svg{width:1.45rem; height:1.45rem; stroke-width:2.3}
.navbtn.bold{font-weight:600}
.navbtn.icon svg{width:1.6rem; height:1.6rem}
main{max-width:44rem; margin:0 auto; padding:0 1rem calc(3.6rem + env(safe-area-inset-bottom) + 2.5rem)}
h1.large{font-size:2.125rem; font-weight:700; line-height:1.2; margin:.15rem .1rem .7rem; letter-spacing:.005em}
.demo-bar{background:var(--yellow-soft); color:var(--yellow-text); font-weight:600; font-size:.875rem; text-align:center; padding:.45rem 1rem}
.demo-bar a{color:inherit; font-weight:700}

/* ============================================================ tab bar（下） */
.nav{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--bar); -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px); box-shadow:0 -.5px 0 var(--bar-sep); padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:44rem; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr)}
.nav a{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.12rem; height:3.6rem; color:var(--tabgray); text-decoration:none; font-size:.72rem; font-weight:600; white-space:nowrap}
.nav svg{width:1.7rem; height:1.7rem; stroke-width:1.9}
.nav a[aria-current="page"]{color:var(--tint)}
.nav a[aria-current="page"] svg{stroke-width:2.4}

/* ============================================================ sections */
h2.sec{font-size:1.3rem; font-weight:700; margin:1.5rem .1rem .55rem; display:flex; align-items:baseline; gap:.5rem; flex-wrap:wrap; line-height:1.3}
h2.sec small{font-weight:500; color:var(--label-2); font-size:.875rem}
.sh{font-size:.8125rem; color:var(--label-2); margin:1.4rem 1rem .4rem; line-height:1.4}
.sf{font-size:.8125rem; color:var(--label-2); margin:-.5rem 1rem 1.1rem; line-height:1.5}
.hint{color:var(--label-2); font-size:.875rem; line-height:1.55; margin:.5rem .2rem .7rem}
.card{background:var(--cell); border-radius:var(--r-card); padding:1rem; margin:.6rem 0}
.card h3{margin:0 0 .45rem; font-size:1.0625rem; font-weight:700; display:flex; align-items:center; gap:.5rem}
.card > p{margin:.45rem 0}
.row{display:flex; align-items:center; gap:.6rem; flex-wrap:wrap}
.between{justify-content:space-between}
.badge-n{display:inline-grid; place-items:center; min-width:1.75rem; height:1.75rem; border-radius:999px; background:var(--tint-bg); color:var(--on-tint); font-weight:700; font-size:.9rem; flex:none}
.tile{flex:none; width:1.9rem; height:1.9rem; border-radius:.5rem; display:grid; place-items:center; font-size:1.05rem; line-height:1; color:#fff}
.tile svg{width:1.15rem; height:1.15rem; stroke-width:2.2}
.tile.lg{width:2.9rem; height:2.9rem; border-radius:.75rem; font-size:1.6rem}
.t-blue{background:#0a7aff} .t-green{background:#30b94d} .t-orange{background:#f58a00} .t-red{background:#f2382d}
.t-gray{background:#8e8e93} .t-purple{background:#a550d6} .t-teal{background:#2fa5c9} .t-indigo{background:#5856d6} .t-yellow{background:#f0b400}

/* ============================================================ buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:.35rem; min-height:3.1rem; padding:.45rem 1rem;
  border-radius:var(--r-btn); border:0; background:var(--fill); color:var(--tint);
  font-weight:600; font-size:1.0625rem; line-height:1.3; text-decoration:none; text-align:center}
.btn:active{opacity:.6}
.btn svg{width:1.2rem; height:1.2rem; flex:none; stroke-width:2.3}
.btn.primary{background:var(--tint-bg); color:var(--on-tint)}
.btn.soft{background:var(--tint-soft); color:var(--tint)}
.btn.food{background:var(--orange-soft); color:var(--orange-text)}
.btn.ok{background:var(--green); color:var(--on-green)}
.btn.line{background:var(--lg); color:var(--on-lg)}
.btn.danger{color:var(--red)}
.btn.block{display:flex; width:100%}
.btn.lg{min-height:3.25rem; font-size:1.0625rem}
.btn.sm{min-height:2.25rem; padding:.2rem .85rem; font-size:.9375rem; border-radius:999px}
.btn[disabled]{opacity:.4; pointer-events:none}
.btns{display:flex; flex-wrap:wrap; gap:.5rem; margin:.6rem 0}
.btns > .btn{flex:1 1 9rem}
.linkbtn{background:none; border:0; padding:.6rem .2rem; color:var(--tint); font-weight:500; min-height:2.75rem; font-size:1.0625rem}
.linkbtn.danger{color:var(--red)}
.x{flex:none; width:2.25rem; height:2.25rem; border-radius:999px; border:0; background:var(--fill); color:var(--label-2); font-size:1rem; font-weight:700; display:grid; place-items:center; padding:0}

/* ============================================================ segmented / chips / pills / switch */
.seg{display:inline-flex; background:var(--fill); border-radius:.6rem; padding:2px; gap:2px; flex:none; max-width:100%}
.seg > button{border:0; background:transparent; border-radius:.5rem; min-height:2.5rem; min-width:3.2rem; padding:0 .7rem; font-weight:500; font-size:.9375rem; color:var(--label); white-space:nowrap}
.seg > button[aria-pressed="true"]{background:var(--seg-on); font-weight:600; box-shadow:0 3px 8px rgba(0,0,0,.12), 0 1px 1px rgba(0,0,0,.06)}
.seg > button.s-yes[aria-pressed="true"]{background:var(--green); color:var(--on-green)}
.seg > button.s-maybe[aria-pressed="true"]{background:var(--yellow); color:var(--on-yellow)}
.seg > button.s-no[aria-pressed="true"]{background:var(--gray); color:var(--on-gray)}
.seg > button.s-food[aria-pressed="true"]{background:var(--orange); color:var(--on-orange)}
.seg.block{display:flex; width:100%}
.seg.block > button{flex:1; min-width:0; padding:0 .25rem}
.seg.lg > button{min-height:3rem; font-size:1.0625rem}

.chips{display:flex; flex-wrap:wrap; gap:.45rem}
.chip{border:0; background:var(--fill); color:var(--label); border-radius:999px; min-height:2.3rem; padding:.2rem .9rem; font-weight:500; font-size:.9375rem; display:inline-flex; align-items:center; gap:.3rem}
.chip[aria-pressed="true"]{background:var(--tint-bg); color:var(--on-tint); font-weight:600}
.chip small{font-weight:500; opacity:.85}
.filters{display:flex; gap:.4rem; overflow-x:auto; padding:.15rem .1rem .5rem; margin:0 -.1rem; scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .chip{flex:none}

.pill{display:inline-flex; align-items:center; gap:.2rem; border-radius:999px; padding:.08rem .55rem; font-size:.8rem; font-weight:600; background:var(--fill); color:var(--label-2); white-space:nowrap; line-height:1.55}
.pill.yes{background:var(--green-soft); color:var(--green-text)}
.pill.maybe{background:var(--yellow-soft); color:var(--yellow-text)}
.pill.warn{background:var(--red-soft); color:var(--red-text)}
.pill.food{background:var(--orange-soft); color:var(--orange-text)}
.pill.primary{background:var(--tint-soft); color:var(--tint)}
.pills{display:flex; flex-wrap:wrap; gap:.35rem; margin-top:.55rem}

.sw{position:relative; flex:none; width:3.2rem; height:1.95rem; border-radius:999px; border:0; padding:0; background:var(--fill-2); transition:background-color .2s}
.sw::after{content:""; position:absolute; top:2px; left:2px; width:calc(1.95rem - 4px); height:calc(1.95rem - 4px); border-radius:999px; background:#fff;
  box-shadow:0 3px 8px rgba(0,0,0,.15), 0 3px 1px rgba(0,0,0,.06); transition:transform .2s}
.sw[aria-checked="true"]{background:var(--switch)}
.sw[aria-checked="true"]::after{transform:translateX(1.25rem)}

/* ============================================================ grouped lists（iOS の設定アプリ風） */
.list{background:var(--cell); border-radius:var(--r-cell); overflow:hidden; margin:.5rem 0 1rem}
.item, .linkrow, .trow, .fld{position:relative; background:var(--cell)}
.item + .item::before, .linkrow + .linkrow::before, .trow + .trow::before, .fld + .fld::before,
.item + .linkrow::before, .linkrow + .item::before, .trow + .fld::before, .fld + .trow::before{content:""; position:absolute; top:0; left:1rem; right:0; height:1px; background:var(--sep)}
.list.ico > .linkrow + .linkrow::before{left:3.85rem}
.item{display:flex; align-items:center; gap:.5rem .7rem; padding:.6rem 1rem; flex-wrap:wrap; min-height:3.3rem}
.item.dim{opacity:.62}
.who{flex:1 1 7.5rem; min-width:0; display:flex; flex-direction:column; align-items:flex-start; text-align:left; background:none; border:0; padding:.15rem 0; color:inherit; border-radius:8px; text-decoration:none}
.who .nm{font-weight:600; font-size:1.0625rem; line-height:1.35; word-break:break-all}
.who .sb{font-size:.8125rem; color:var(--label-2); display:flex; flex-wrap:wrap; gap:.1rem .7rem; margin-top:.12rem; line-height:1.45}
.who .sb b{font-weight:600; color:var(--label)}
.star{color:var(--star); margin-right:.15rem}
.t-yes{color:var(--green-text)} .t-maybe{color:var(--yellow-text)} .t-warn{color:var(--red-text)} .t-food{color:var(--orange-text)}
.linkrow{display:flex; align-items:center; gap:.75rem; padding:.55rem 1rem; min-height:3.3rem; color:var(--label); text-decoration:none; border:0; width:100%; text-align:left; font-size:1.0625rem}
.linkrow:active, button.item:active{background:var(--hl)}
.linkrow .em{font-size:1.35rem; flex:none; width:1.9rem; text-align:center}
.linkrow b{display:block; font-weight:500}
.linkrow small{display:block; color:var(--label-2); font-size:.8125rem; line-height:1.45}
.linkrow .val{color:var(--label-2); flex:none; font-variant-numeric:tabular-nums}
.chev{flex:none; color:var(--label-3)}
.chev svg{width:1.05rem; height:1.05rem; stroke-width:2.6}
.trow{display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:.55rem 1rem; min-height:3.3rem}
.trow .grow b{font-weight:500; display:block}
.trow .grow small{display:block; color:var(--label-2); font-size:.8125rem; line-height:1.45}
.empty{text-align:center; padding:1.6rem 1rem; color:var(--label-2)}
.empty .em{font-size:2.4rem; line-height:1.2}
.empty b{display:block; color:var(--label); font-size:1.0625rem; margin:.35rem 0 .2rem; font-weight:600}

/* ============================================================ events */
.ev{display:flex; gap:.85rem; align-items:flex-start; text-decoration:none; color:inherit; background:var(--cell); border-radius:var(--r-card); padding:.9rem 1rem; margin:.6rem 0}
.ev:active{background:var(--hl)}
.ev .tile{background:color-mix(in srgb, var(--sport, #0a6cff) 18%, transparent)}
.ev .body{flex:1; min-width:0}
.ev .ev-top{display:flex; align-items:center; justify-content:space-between; gap:.5rem}
.ev .d{font-size:1.25rem; font-weight:700; line-height:1.3}
.ev .wh{color:var(--label-2); font-size:.875rem; line-height:1.45; margin-top:.05rem}
.evhead{display:flex; gap:.85rem; align-items:center; padding:.2rem .1rem .1rem}
.evhead .tile{background:color-mix(in srgb, var(--sport, #0a6cff) 18%, transparent)}
.evhead .sp{font-weight:600; color:var(--label-2); font-size:.9375rem}
.evhead .dt{font-size:1.75rem; font-weight:700; line-height:1.25}
.evhead .wh{color:var(--label-2); font-size:.875rem}

.etabs{position:sticky; top:calc(2.9rem + env(safe-area-inset-top)); z-index:15; display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:2px;
  background:var(--fill); padding:2px; border-radius:.65rem; margin:.7rem 0 .5rem; -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px)}
.etabs::before{content:""; position:absolute; inset:-6px -1rem -4px; background:var(--bg); z-index:-1}
.etabs a{display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:3.1rem; border-radius:.55rem; text-decoration:none; color:var(--label); font-weight:500; font-size:.9375rem; line-height:1.2; padding:.15rem .1rem; background:transparent}
.etabs a small{font-weight:500; font-size:.75rem; color:var(--label-2); margin-top:.08rem}
.etabs a[aria-current="page"]{background:var(--seg-on); font-weight:700; box-shadow:0 3px 8px rgba(0,0,0,.12), 0 1px 1px rgba(0,0,0,.06)}
.etabs a[aria-current="page"] small{color:var(--seg-accent); font-weight:600}

.stats{display:grid; grid-template-columns:repeat(auto-fit, minmax(6.2rem, 1fr)); gap:.5rem; margin:.5rem 0 .6rem}
.stat{background:var(--cell); border-radius:var(--r-cell); padding:.55rem .8rem}
.stat .k{font-size:.8125rem; color:var(--label-2); font-weight:500}
.stat .v{font-size:1.6rem; font-weight:700; line-height:1.2; font-variant-numeric:tabular-nums}
.stat .v small{font-size:.875rem; color:var(--label-2); font-weight:500; margin-left:.12rem}
.stat.warn .v{color:var(--red-text)}
.stat.ok .v{color:var(--green-text)}
.bar{height:.5rem; background:var(--fill); border-radius:999px; overflow:hidden; margin:.45rem 0 .25rem}
.bar > i{display:block; height:100%; background:var(--switch); border-radius:999px}

.orders{flex-basis:100%; display:flex; flex-wrap:wrap; gap:.4rem; align-items:center}

<script>
'use strict';
/* ============================================================================
   幹事ノート — スポーツの集まりの「出欠・ご飯の注文・参加費の集金」を
   日付と種目ごとにまとめる、幹事さん用のアプリ。

   - データはこの端末の IndexedDB にだけ保存する（サーバーには送らない）

/* ============================================================ utilities */
const $  = (s, r = document) => r.querySelector(s);

const diffDays = (a, b) => Math.round((dateOf(b) - dateOf(a)) / 86400000);

  const s = toHalf(String(v)).replace(/[,\s¥￥円]/g, '');

/* ============================================================ constants */

const SPORT_PRESETS = [

  { name:'ソフトボール', emoji:'🥎' }, { name:'ランニング', emoji:'🏃' },
];
const EMOJIS = ['🏀','🏐','⚽','🏸','🎾','🏓','⚾','🥎','🏈','🏉','🏃','🚴','🏊','⛳','🎳','🧗','🥏','🏒','🤸','🧘','🎯','🏆','🏅'];

const PAY_METHODS = ['現金','PayPay','振込','その他'];
const EXPENSE_PRESETS = ['コート代','体育館代','ボール代','保険代','飲み物代'];
/* 取り込み時に「どちらが新しいか」を比べる単位。同じまとまりの項目は一緒に動く */
const GROUPS = {
  status:['status'], dinner:['dinner'], orders:['orders','orderNote','orderOk'],
  fee:['tierId','feeOverride'], pay:['paid','paidAt','payMethod'], dpay:['dinnerPaid','dinnerPaidAt'],
  tape:['tapeDone'], memo:['memo'], removed:['removed'],
};
const GROUP_LABEL = { status:'出欠', dinner:'ご飯', orders:'注文', fee:'料金', pay:'集金', dpay:'ご飯代', tape:'名札', memo:'メモ', removed:'外した人', added:'追加された人' };
const HEADER_FIELDS = ['date','sportId','title','start','end','place','capacity','tiers','dinner','menu','tape','shopId','dinnerTime','dinnerFee','expenses','memo','sent','deletedAt'];
const STORES = ['sports','members','shops','events','extras'];
const APP_URL = 'https://ko-yamatoya.github.io/Projects/kanji-note/';
const SELFTEST = /[?&]selftest=/.test(location.search);

/* ============================================================ normalize（取り込み・保存の門番） */
function normTier(t){
  if (!t || typeof t !== 'object') return null;
  return { id: normId(t.id) || uid(), label: cleanStr(t.label, 20) || '一般', amount: toInt(t.amount) ?? 0 };
}
function normTiers(a){
  const seen = new Set(), out = [];
  for (const t of arr(a).map(normTier).filter(Boolean)){ if (seen.has(t.id)) t.id = uid(); seen.add(t.id); out.push(t); if (out.length >= 8) break; }
  return out.length ? out : [{ id: uid(), label: '一般', amount: 0 }];
}
function normExpense(x){
  if (!x || typeof x !== 'object') return null;
  const label = cleanStr(x.label, 30), amount = toInt(x.amount) ?? 0;
  if (!label && !amount) return null;
  return { id: normId(x.id) || uid(), label: label || '支出', amount };
}
const normExpenses = a => arr(a).map(normExpense).filter(Boolean).slice(0, 12);
function normOrders(a){
  const map = new Map();
  for (const o of arr(a)){
    if (!o || typeof o !== 'object') continue;
    const no = normNo(o.no); if (!no) continue;
    const qty = toInt(o.qty, 1, 99) ?? 1;
    map.set(no, Math.min(99, (map.get(no) || 0) + qty));
  }
  return Array.from(map, ([no, qty]) => ({ no, qty })).slice(0, 20);
}
function normMenuItem(x){
  if (!x || typeof x !== 'object') return null;
  const no = normNo(x.no); if (!no) return null;
  return { no, name: cleanStr(x.name, 40), price: toInt(x.price) };
}
function normSport(s){
  if (!s || typeof s !== 'object') return null;
  const name = cleanStr(s.name, 20); if (!name) return null;
  const t = nowISO();
  return {
    id: normId(s.id) || uid(), name,
    emoji: EMOJIS.includes(s.emoji) ? s.emoji : '🏅',
    color: (typeof s.color === 'string' && /^#[0-9a-fA-F]{6}$/.test(s.color)) ? s.color : COLORS[0],
    start: TIME_RE.test(s.start) ? s.start : '', end: TIME_RE.test(s.end) ? s.end : '',
    place: cleanStr(s.place, 60), capacity: toInt(s.capacity, 1, 999),
    tiers: normTiers(s.tiers),
    dinner: s.dinner === true, menu: s.menu === true, tape: s.tape === true,
    shopId: normId(s.shopId), dinnerTime: TIME_RE.test(s.dinnerTime) ? s.dinnerTime : '',
    expenses: normExpenses(s.expenses),
    seed: ['pending','yes','off'].includes(s.seed) ? s.seed : 'pending',
    order: toInt(s.order, 0, 9999) ?? 0, archived: s.archived === true,
    createdAt: normTs(s.createdAt) || t, updatedAt: normTs(s.updatedAt) || t, deletedAt: normTs(s.deletedAt),
  };
}
function normMember(m){
  if (!m || typeof m !== 'object') return null;
  const name = cleanName(m.name); if (!name) return null;
  const t = nowISO();
  return {
    id: normId(m.id) || uid(), name, kana: cleanStr(m.kana, 40), tape: cleanStr(m.tape, 20),
    fixed: Array.from(new Set(arr(m.fixed).map(normId).filter(Boolean))).slice(0, 20),
    tier: cleanStr(m.tier, 20), usual: normOrders(m.usual), memo: cleanStr(m.memo, 300),
    archived: m.archived === true,
    createdAt: normTs(m.createdAt) || t, updatedAt: normTs(m.updatedAt) || t, deletedAt: normTs(m.deletedAt),
  };
}
function normShop(s){
  if (!s || typeof s !== 'object') return null;
  const name = cleanStr(s.name, 40); if (!name) return null;
  const seen = new Set(), menu = [];
  for (const it of arr(s.menu).map(normMenuItem).filter(Boolean)){
    if (seen.has(it.no)) continue; seen.add(it.no); menu.push(it); if (menu.length >= 300) break;
  }
  menu.sort((a, b) => natCmp(a.no, b.no));
  const t = nowISO();
  return {
    id: normId(s.id) || uid(), name,
    phone: toHalf(cleanStr(s.phone, 24)).replace(/[^\d+\-() ]/g, '').slice(0, 20),
    memo: cleanStr(s.memo, 200), menu,
    createdAt: normTs(s.createdAt) || t, updatedAt: normTs(s.updatedAt) || t, deletedAt: normTs(s.deletedAt),
  };
}
function normEntry(e){
  if (!e || typeof e !== 'object') return null;
  const memberId = normId(e.memberId); if (!memberId) return null;
  const ts = {}, src = (e.ts && typeof e.ts === 'object') ? e.ts : {};
  for (const g of Object.keys(GROUPS)){ const v = normTs(src[g]); if (v) ts[g] = v; }
  const paid = e.paid === true, dPaid = e.dinnerPaid === true;
  return {
    memberId, status: ['yes','maybe','no'].includes(e.status) ? e.status : '',
    dinner: e.dinner === true ? true : (e.dinner === false ? false : null),
    orders: normOrders(e.orders), orderNote: cleanStr(e.orderNote, 100), orderOk: e.orderOk === true,
    tierId: normId(e.tierId), feeOverride: toInt(e.feeOverride),
    paid, paidAt: paid ? normTs(e.paidAt) : null, payMethod: paid ? cleanStr(e.payMethod, 10) : '',
    dinnerPaid: dPaid, dinnerPaidAt: dPaid ? normTs(e.dinnerPaidAt) : null,
    tapeDone: e.tapeDone === true, memo: cleanStr(e.memo, 200), removed: e.removed === true,
    addedAt: normTs(e.addedAt) || nowISO(), ts,
  };
}
function normEvent(v){
  if (!v || typeof v !== 'object' || !validDate(v.date)) return null;
  const df = (v.dinnerFee && typeof v.dinnerFee === 'object') ? v.dinnerFee : {};
  const seen = new Set(), entries = [];
  for (const en of arr(v.entries).map(normEntry).filter(Boolean)){
    if (seen.has(en.memberId)) continue; seen.add(en.memberId); entries.push(en); if (entries.length >= 400) break;
  }
  let sent = null;
  if (v.sent && typeof v.sent === 'object' && normTs(v.sent.at)){
    const tally = {}, src = (v.sent.tally && typeof v.sent.tally === 'object') ? v.sent.tally : {};
    for (const [k, q] of Object.entries(src)){ const no = normNo(k), n = toInt(q, 0, 9999); if (no && n) tally[no] = n; }
    sent = { at: normTs(v.sent.at), count: toInt(v.sent.count, 0, 9999) ?? 0, tally };
  }
  let origin = null;
  if (v.origin && typeof v.origin === 'object' && normTs(v.origin.at)) origin = { from: cleanStr(v.origin.from, 30), at: normTs(v.origin.at) };
  const t = nowISO();
  return {
    id: normId(v.id) || uid(), date: v.date, sportId: normId(v.sportId), title: cleanStr(v.title, 30),
    start: TIME_RE.test(v.start) ? v.start : '', end: TIME_RE.test(v.end) ? v.end : '',
    place: cleanStr(v.place, 60), capacity: toInt(v.capacity, 1, 999),
    tiers: normTiers(v.tiers), dinner: v.dinner === true, menu: v.menu === true, tape: v.tape === true,
    shopId: normId(v.shopId), dinnerTime: TIME_RE.test(v.dinnerTime) ? v.dinnerTime : '',
    dinnerFee: {
      mode: ['none','split','fixed','menu'].includes(df.mode) ? df.mode : 'none',
      total: toInt(df.total) ?? 0, fixed: toInt(df.fixed) ?? 0,
      round: [1, 10, 100, 500].includes(df.round) ? df.round : 100,
    },
    expenses: normExpenses(v.expenses), memo: cleanStr(v.memo, 300), sent, origin, entries,
    createdAt: normTs(v.createdAt) || t, updatedAt: normTs(v.updatedAt) || t,
    hdrAt: normTs(v.hdrAt) || normTs(v.updatedAt) || t, deletedAt: normTs(v.deletedAt),
  };
}
function normExtra(x){
  if (!x || typeof x !== 'object' || !validDate(x.date)) return null;
  const amount = toInt(x.amount); if (amount == null) return null;
  const t = nowISO();
  return { id: normId(x.id) || uid(), date: x.date, label: cleanStr(x.label, 40) || 'その他', amount, kind: x.kind === 'in' ? 'in' : 'out',
    createdAt: normTs(x.createdAt) || t, updatedAt: normTs(x.updatedAt) || t, deletedAt: normTs(x.deletedAt) };
}
function normSettings(s){
  s = (s && typeof s === 'object') ? s : {};
  return {
    hostName: cleanStr(s.hostName, 30), payNote: cleanStr(s.payNote, 120),
    openingBalance: toInt(s.openingBalance, -10000000, 10000000) ?? 0,
    lastBackupAt: normTs(s.lastBackupAt),
    defaultPayMethod: PAY_METHODS.includes(s.defaultPayMethod) ? s.defaultPayMethod : '現金',
    onboarded: s.onboarded === true,
  };
}
const NORM = { sports: normSport, members: normMember, shops: normShop, events: normEvent, extras: normExtra };

/* ============================================================ state & prefs */
const S = {
  sports: [], members: [], shops: [], events: [], extras: [], settings: normSettings({}),
  demo: false, persisted: null, saveError: false,

        sportFilter: 'all', calMonth: null, calDay: null, pastLimit: 12, welcome: null, showArchived: false },

/* ============================================================ IndexedDB */
const DB_NAME = 'kanji-note' + (SELFTEST ? '-selftest' : ''), DB_VER = 1;
let db = null, dbOK = false;
function openDB(){
  return new Promise((resolve, reject) => {
    let req;
    try { req = indexedDB.open(DB_NAME, DB_VER); } catch (e) { return reject(e); }
    req.onupgradeneeded = e => {
      const d = e.target.result;
      for (const s of STORES) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' });
      if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv', { keyPath: 'k' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
    req.onblocked = () => reject(new Error('IndexedDB blocked'));
  });
}
function idbAll(store){
  return new Promise((res, rej) => {
    const r = db.transaction([store], 'readonly').objectStore(store).getAll();
    r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error);
  });
}
function idbWrite(store, fn){
  if (!dbOK || !db || S.demo) return Promise.resolve();
  return new Promise((res, rej) => {
    const t = db.transaction([store], 'readwrite'), s = t.objectStore(store);
    fn(s);
    t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
const idbPut = (store, objs) => idbWrite(store, s => { for (const o of objs) s.put(clone(o)); });
const idbReplaceAll = (store, objs) => idbWrite(store, s => { s.clear(); for (const o of objs) s.put(clone(o)); });
function kvGet(k){
  return new Promise((res, rej) => {
    const r = db.transaction(['kv'], 'readonly').objectStore('kv').get(k);
    r.onsuccess = () => res(r.result ? r.result.v : undefined); r.onerror = () => rej(r.error);
  });
}
const kvPut = (k, v) => idbWrite('kv', s => s.put({ k, v: clone(v) }));
async function loadAll(){
  for (const s of STORES) S[s] = (await idbAll(s)).map(NORM[s]).filter(Boolean);
  S.settings = normSettings(await kvGet('settings'));
  ver++;
}
async function saveAll(){
  if (!dbOK || S.demo) return;
  for (const s of STORES) await idbReplaceAll(s, S[s]);
  await kvPut('settings', S.settings);
}
let persistAsked = false;
function requestPersist(){
  if (persistAsked || S.demo) return; persistAsked = true;
  try {
    if (navigator.storage && navigator.storage.persist)
      navigator.storage.persist().then(g => { S.persisted = g; }).catch(() => {});
  } catch (e) {}
}
function onSaveError(err){
  console.warn('save failed', err);
  if (!S.saveError){ S.saveError = true; toast('保存できませんでした。「データ」タブからバックアップを取ってください'); }
}
function persist(store, objs){
  if (S.demo || !dbOK) return;
  idbPut(store, objs).catch(onSaveError);
  requestPersist();
}

/* ============================================================ mutations */
function upsert(store, obj){
  const a = S[store], i = a.findIndex(x => x.id === obj.id);
  if (i >= 0) a[i] = obj; else a.push(obj);
}
function save(store, obj){ obj.updatedAt = nowISO(); upsert(store, obj); ver++; persist(store, [obj]); }
function saveEventHeader(ev){ ev.updatedAt = ev.hdrAt = nowISO(); upsert('events', ev); ver++; persist('events', [ev]); }
function saveEventEntries(ev){ ev.updatedAt = nowISO(); upsert('events', ev); ver++; persist('events', [ev]); }
function setEntry(ev, en, group, patch){
  Object.assign(en, patch);
  en.ts[group] = nowISO();
  saveEventEntries(ev);
}
function saveSettings(patch){
  Object.assign(S.settings, patch); ver++;
  if (!S.demo && dbOK) kvPut('settings', S.settings).catch(onSaveError);
}

/* ============================================================ selectors */
const live = a => a.filter(x => !x.deletedAt);
const byId = (a, id) => (id && a.find(x => x.id === id)) || null;
const sportOf  = ev => byId(S.sports, ev.sportId);
const memberOf = id => byId(S.members, id);
const shopOf   = id => byId(S.shops, id);
const liveEvents = () => live(S.events);
const activeSports = () => live(S.sports).filter(s => !s.archived).sort((a, b) => a.order - b.order || a.createdAt.localeCompare(b.createdAt));
const liveShops = () => live(S.shops).sort((a, b) => collator.compare(a.name, b.name));
const activeMembers = () => live(S.members).filter(m => !m.archived);
const evTitle = ev => ev.title || sportOf(ev)?.name || '（種目なし）';
const evEmoji = ev => sportOf(ev)?.emoji || '📅';
const evColor = ev => sportOf(ev)?.color || '#1d5fd1';
const entriesOf = ev => ev.entries.filter(e => !e.removed);
const entryOf = (ev, mid) => ev.entries.find(e => e.memberId === mid) || null;
const isFixed = (m, sportId) => !!(m && sportId && m.fixed.includes(sportId));
const nameOf = id => memberOf(id)?.name || '（削除した人）';
const tapeNameOf = m => m ? (m.tape || m.name) : '？';
const sortKey = m => m ? (m.kana || m.name) : '';
const timeRange = ev => ev.start ? `${ev.start}〜${ev.end || ''}` : '';
function sortedEntries(ev){
  return entriesOf(ev).map(e => ({ e, m: memberOf(e.memberId) })).sort((a, b) => {
    const fa = isFixed(a.m, ev.sportId) ? 0 : 1, fb = isFixed(b.m, ev.sportId) ? 0 : 1;
    if (fa !== fb) return fa - fb;
    return collator.compare(sortKey(a.m), sortKey(b.m));
  });
}
function menuItem(shop, no){ return shop ? (shop.menu.find(x => x.no === no) || null) : null; }

/* ============================================================ money */
const tierOf = (ev, en) => ev.tiers.find(t => t.id === en.tierId) || ev.tiers[0];
function feeOf(ev, en){
  if (en.status !== 'yes') return 0;
  if (en.feeOverride != null) return en.feeOverride;
  return tierOf(ev, en)?.amount || 0;
}
const dinnerPeople = ev => entriesOf(ev).filter(e => e.dinner === true);
const ceilTo = (n, u) => Math.ceil(n / u) * u;
const dinnerFeeOn = ev => ev.dinner && ev.dinnerFee.mode !== 'none';
function dinnerFeeOf(ev, en, cnt){
  if (!ev.dinner || en.dinner !== true) return 0;
  const f = ev.dinnerFee;
  if (f.mode === 'fixed') return f.fixed;
  if (f.mode === 'split'){ const c = cnt ?? dinnerPeople(ev).length; return c ? ceilTo(f.total / c, f.round || 1) : 0; }
  if (f.mode === 'menu'){ const shop = shopOf(ev.shopId); return en.orders.reduce((s, o) => s + (menuItem(shop, o.no)?.price || 0) * o.qty, 0); }
  return 0;
}
function summary(ev){
  const es = entriesOf(ev), dcnt = es.filter(e => e.dinner === true).length;
  const c = { yes:0, maybe:0, no:0, none:0, total: es.length, dinner:0, dinnerNo:0, dinnerAsk:0, dinnerOnly:0,
    items:0, noOrder:0, orderOk:0, ordered:0, tapeDone:0,
    feeDue:0, feeGot:0, feePeople:0, feePaid:0, dDue:0, dGot:0, dPeople:0, dPaid:0, expenses:0 };
  for (const e of es){
    if (e.status === 'yes') c.yes++; else if (e.status === 'maybe') c.maybe++; else if (e.status === 'no') c.no++; else c.none++;
    if (ev.dinner){
      if (e.dinner === true){
        c.dinner++; if (e.status !== 'yes') c.dinnerOnly++;
        const q = e.orders.reduce((s, o) => s + o.qty, 0); c.items += q;
        if (ev.menu){ if (q){ c.ordered++; if (e.orderOk) c.orderOk++; } else c.noOrder++; }
      } else if (e.dinner === false) c.dinnerNo++;
      else if (e.status === 'yes') c.dinnerAsk++;
    }
    const fee = feeOf(ev, e);
    if (e.status === 'yes' && fee > 0){ c.feePeople++; c.feeDue += fee; if (e.paid){ c.feePaid++; c.feeGot += fee; } }
    if (ev.tape && e.status === 'yes' && e.tapeDone) c.tapeDone++;
    if (dinnerFeeOn(ev) && e.dinner === true){
      const df = dinnerFeeOf(ev, e, dcnt);
      if (df > 0){ c.dPeople++; c.dDue += df; if (e.dinnerPaid){ c.dPaid++; c.dGot += df; } }
    }
  }
  c.expenses = ev.expenses.reduce((s, x) => s + x.amount, 0);
  c.balance = c.feeGot - c.expenses;
  c.balanceDue = c.feeDue - c.expenses;
  return c;
}
function tally(ev){
  const shop = shopOf(ev.shopId), map = new Map();
  for (const { e, m } of sortedEntries(ev)){
    if (e.dinner !== true) continue;
    for (const o of e.orders){
      let t = map.get(o.no);
      if (!t){ const it = menuItem(shop, o.no); t = { no: o.no, name: it?.name || '', price: it?.price ?? null, qty: 0, people: [] }; map.set(o.no, t); }
      t.qty += o.qty; t.people.push({ name: m?.name || '（削除した人）', qty: o.qty });
    }
  }
  const rows = Array.from(map.values()).sort((a, b) => natCmp(a.no, b.no));
  return { rows, items: rows.reduce((s, r) => s + r.qty, 0), total: rows.reduce((s, r) => s + (r.price || 0) * r.qty, 0), unknown: rows.some(r => r.price == null) };
}
const tallyMap = ev => Object.fromEntries(tally(ev).rows.map(r => [r.no, r.qty]));
function sentDiff(ev){
  if (!ev.sent) return null;
  const now = ev.menu ? tallyMap(ev) : {}, was = ev.menu ? ev.sent.tally : {};
  const changes = [];
  for (const k of Array.from(new Set([...Object.keys(now), ...Object.keys(was)])).sort(natCmp)){
    const a = was[k] || 0, b = now[k] || 0; if (a !== b) changes.push({ no: k, from: a, to: b });
  }
  const count = dinnerPeople(ev).length;
  return { changes, countFrom: ev.sent.count, countTo: count, changed: changes.length > 0 || count !== ev.sent.count };
}
function orderNotes(ev){
  const map = new Map();
  for (const e of dinnerPeople(ev)) if (e.orderNote) map.set(e.orderNote, (map.get(e.orderNote) || 0) + 1);
  return Array.from(map, ([text, count]) => ({ text, count }));
}

/* 種目ごと・月ごとの集計（お金タブ） */
function ledger(){
  const months = new Map(), today = todayISO();
  const get = ym => { if (!months.has(ym)) months.set(ym, { ym, events:0, people:0, feeGot:0, feeDue:0, expenses:0, extraIn:0, extraOut:0 }); return months.get(ym); };
  let cash = S.settings.openingBalance;
  for (const ev of liveEvents()){
    const s = summary(ev), r = get(ev.date.slice(0, 7));
    r.events++; r.people += s.yes; r.feeGot += s.feeGot; r.feeDue += s.feeDue; r.expenses += s.expenses;
    if (ev.date <= today) cash += s.feeGot - s.expenses;
    else cash += s.feeGot;                       // 先に受け取った参加費だけは手元にある
  }
  for (const x of live(S.extras)){
    const r = get(x.date.slice(0, 7));
    if (x.kind === 'in') r.extraIn += x.amount; else r.extraOut += x.amount;
    if (x.date <= today) cash += x.kind === 'in' ? x.amount : -x.amount;
  }
  const rows = Array.from(months.values()).sort((a, b) => b.ym.localeCompare(a.ym));
  for (const r of rows) r.net = r.feeGot + r.extraIn - r.expenses - r.extraOut;
  return { rows, cash };
}
function unpaidAll(){

  if (statCache.ver === ver) return statCache.map;

  const get = id => { if (!map.has(id)) map.set(id, { count: 0, last: null, unpaid: 0, bySport: {}, history: [] }); return map.get(id); };
  for (const ev of liveEvents()){

      if (e.status === 'yes' && past){

        if (!st.last || ev.date > st.last) st.last = ev.date;

        if (dinnerFeeOn(ev)){ const df = dinnerFeeOf(ev, e, dcnt); if (df > 0 && !e.dinnerPaid) st.unpaid += df; }
      }
    }

/* ============================================================ parsing */
function parseNames(text){
  const t = toHalf(String(text || ''));
  const parts = /[\n、,;／\/]/.test(t) ? t.split(/[\n、,;／\/]+/) : t.split(/\s+/);
  const out = [], seen = new Set();
  for (let p of parts){
    p = p.replace(/^[\s・\-–—*•●○◯□■☆★✓✔]+/, '')
         .replace(/^(\d{1,3}[\.)）:：、]\s*|\d{1,3}\s+|[①-⑳]\s*)/, '')
         .replace(/\s*(さん|様)$/, '').replace(/\s+/g, ' ').trim();
    if (!p || p.length > 40 || seen.has(p)) continue;
    seen.add(p); out.push(p);
  }
  return out.slice(0, 200);
}
function parseMenu(text){
  const out = [];
  for (let line of String(text || '').split(/\r?\n/)){
    line = toHalf(line).trim(); if (!line) continue;
    const m = /^(?:No\.?|#)?\s*([0-9A-Za-z-]{1,8}?)(?:番)?[\s.)、,:：\t]+(.+?)(?:[\s,\t:：]+[¥￥]?\s*([0-9][0-9,]{0,8})\s*円?)?$/.exec(line);
    if (!m) continue;
    const no = normNo(m[1]); if (!no) continue;
    out.push({ no, name: m[2].replace(/[\s,\t]+$/, '').slice(0, 40), price: m[3] ? toInt(m[3]) : null });
  }
  return out;
}
function parseOrders(text){
  const out = [];
  for (const tok of toHalf(String(text || '')).split(/[\s,、/]+/)){
    if (!tok) continue;
    const m = /^(?:No\.?|#)?([0-9A-Za-z-]{1,8}?)(?:番)?(?:[x×*](\d{1,2}))?$/i.exec(tok);
    if (!m) continue;
    const no = normNo(m[1]); if (no) out.push({ no, qty: m[2] ? Math.max(1, Math.min(99, +m[2])) : 1 });
  }
  return normOrders(out);
}

/* ============================================================ 受け渡しパッケージ */
const PKG_TAG = 'KN1';
function b64u(u8){
  let s = '';
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function unb64u(s){
  s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '=';
  const bin = atob(s), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8;
}
async function encodePkg(obj){
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  if (typeof CompressionStream === 'function'){
    try {
      const buf = await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate'))).arrayBuffer();
      return PKG_TAG + 'z' + b64u(new Uint8Array(buf));
    } catch (e) {}
  }
  return PKG_TAG + 'j' + b64u(bytes);
}
/* 文章・リンク・ファイルの中身のどれを渡されても、パッケージを取り出す */
async function decodeAny(text){
  text = String(text || '').trim();
  if (!text) throw new Error('empty');
  const m = /KN1([zj])([A-Za-z0-9_-]{8,})/.exec(text);
  let obj;
  if (m){
    let bytes = unb64u(m[2]);
    if (bytes.length > 4000000) throw new Error('too-big');
    if (m[1] === 'z'){
      if (typeof DecompressionStream !== 'function') throw new Error('old-browser');
      bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'))).arrayBuffer());
    }
    obj = JSON.parse(new TextDecoder().decode(bytes));
  } else if (text[0] === '{'){
    obj = JSON.parse(text);
  } else throw new Error('no-code');
  if (!obj || typeof obj !== 'object' || obj.app !== 'kanji-note') throw new Error('not-ours');
  return obj;
}

/* ============================================================ merge（取り込み） */
function mergePkg(pkg, opts = {}){
  const inc = {}; for (const s of STORES) inc[s] = arr(pkg[s]).map(NORM[s]).filter(Boolean);
  const st = { added: { sports:0, members:0, shops:0, events:0, extras:0 }, updated: { sports:0, members:0, shops:0, events:0, extras:0 },
               groups: {}, newEvents: [], touchedEvents: [] };
  if (opts.replace){
    for (const s of STORES){ S[s] = inc[s]; st.added[s] = inc[s].length; }
    if (pkg.settings) S.settings = normSettings(Object.assign({}, pkg.settings, { onboarded: true }));
    ver++;
    return st;
  }
  const keepMemo = pkg.kind !== 'backup';
  for (const k of ['sports','members','shops','extras']){
    for (const x of inc[k]){
      const cur = byId(S[k], x.id);
      if (!cur){ S[k].push(x); st.added[k]++; }
      else if (x.updatedAt > cur.updatedAt){
        if (k === 'members' && keepMemo) x.memo = cur.memo;
        Object.assign(cur, x); st.updated[k]++;
      }
    }
  }
  for (const x of inc.events){
    const cur = byId(S.events, x.id);
    if (!cur){
      if (pkg.kind === 'handoff') x.origin = { from: cleanStr(pkg.from, 30), at: normTs(pkg.at) || nowISO() };
      else x.origin = null;
      S.events.push(x); st.added.events++; st.newEvents.push(x.id);
      continue;
    }
    let touched = false;
    if (x.hdrAt > cur.hdrAt){ for (const f of HEADER_FIELDS) cur[f] = clone(x[f]); cur.hdrAt = x.hdrAt; touched = true; st.updated.events++; }
    for (const ie of x.entries){
      const ce = entryOf(cur, ie.memberId);
      if (!ce){ cur.entries.push(ie); touched = true; st.groups.added = (st.groups.added || 0) + 1; continue; }
      for (const [g, fields] of Object.entries(GROUPS)){
        const a = ie.ts[g] || '', b = ce.ts[g] || '';
        if (a && a > b){ for (const f of fields) ce[f] = clone(ie[f]); ce.ts[g] = a; touched = true; st.groups[g] = (st.groups[g] || 0) + 1; }
      }
    }
    if (touched){ cur.updatedAt = nowISO(); st.touchedEvents.push(cur.id); }
  }
  ver++;
  return st;
}
function mergeReport(st){
  const parts = [];
  if (st.added.events) parts.push(`新しい日程 ${st.added.events}件`);
  if (st.updated.events) parts.push(`日程の内容 ${st.updated.events}件`);
  for (const g of ['added','status','dinner','orders','pay','dpay','tape','fee','memo','removed']) if (st.groups[g]) parts.push(`${GROUP_LABEL[g]} ${st.groups[g]}件`);
  if (st.added.members) parts.push(`メンバー ${st.added.members}人`);
  if (st.updated.members) parts.push(`メンバー情報 ${st.updated.members}件`);
  if (st.added.shops + st.updated.shops) parts.push(`お店 ${st.added.shops + st.updated.shops}件`);
  if (st.added.sports + st.updated.sports) parts.push(`種目 ${st.added.sports + st.updated.sports}件`);
  if (st.added.extras + st.updated.extras) parts.push(`その他のお金 ${st.added.extras + st.updated.extras}件`);
  return parts.length ? parts.join('・') + ' を反映しました' : '新しい変更はありませんでした（すでに最新です）';
}

const filteredEvents = () => liveEvents().filter(e => S.ui.sportFilter === 'all' || e.sportId === S.ui.sportFilter);
function homeList(){
  const t = todayISO(), evs = filteredEvents();
  const up = evs.filter(e => e.date >= t).sort((a, b) => a.date.localeCompare(b.date) || evTitle(a).localeCompare(evTitle(b)));
  const past = evs.filter(e => e.date < t).sort((a, b) => b.date.localeCompare(a.date));
  let html = `<h2 class="sec">これからの予定 <small>${up.length}件</small></h2>`;
  html += up.length ? up.map(evCard).join('')
    : `<div class="card">${emptyBox('📅', 'これからの予定はまだありません', '上の「日程を作る」から、日付と種目を選んで作ります。')}</div>`;
  if (past.length){
    html += `<h2 class="sec">これまで <small>${past.length}件</small></h2>`;
    let lastYM = '', rows = '';
    for (const ev of past.slice(0, S.ui.pastLimit)){
      const ym = ev.date.slice(0, 7);
      if (ym !== lastYM){ if (rows) html += `<div class="list">${rows}</div>`; rows = ''; html += `<div class="small muted" style="margin:.8rem .2rem .1rem;font-weight:600">${fmtYM(ym)}</div>`; lastYM = ym; }
      rows += pastRow(ev);

    if (rows) html += `<div class="list">${rows}</div>`;

  }

}
function evCard(ev){
  const s = summary(ev), d = diffDays(todayISO(), ev.date);
  const rel = d === 0 ? '今日' : d === 1 ? '明日' : d > 1 ? `あと${d}日` : '';
  const wh = [timeRange(ev), ev.place].filter(Boolean).join('・');
  return `<a class="ev" href="#/e/${ev.id}" style="--sport:${evColor(ev)}"><span class="tile lg" aria-hidden="true">${evEmoji(ev)}</span><div class="body">
    <div class="ev-top"><span class="d">${fmtDate(ev.date)}</span>${rel ? `<span class="pill ${d === 0 ? 'warn' : 'primary'}">${rel}</span>` : ''}</div>
    <div class="wh"><b style="color:var(--label);font-weight:600">${esc(evTitle(ev))}</b>${wh ? '・' + esc(wh) : ''}</div>
    <div class="pills">
      <span class="pill yes">参加 ${s.yes}${ev.capacity ? '/' + ev.capacity : ''}人</span>
      ${s.maybe ? `<span class="pill maybe">未定 ${s.maybe}</span>` : ''}
      ${s.none ? `<span class="pill">未回答 ${s.none}</span>` : ''}
      ${ev.dinner ? `<span class="pill food">ご飯 ${s.dinner}人</span>` : ''}
      ${s.feePeople ? `<span class="pill ${s.feePaid === s.feePeople ? 'yes' : ''}">集金 ${s.feePaid}/${s.feePeople}</span>` : ''}

}
function pastRow(ev){

    <span class="grow"><b>${fmtShort(ev.date)} ${esc(evTitle(ev))}</b><small>参加 ${s.yes}人${ev.dinner ? `・ご飯 ${s.dinner}人` : ''}</small></span>
    ${unpaidN ? `<span class="pill warn">未払い ${unpaidN}件</span>` : (s.feePeople ? '<span class="pill yes">集金済み</span>' : '')}
    <span class="chev">${IC.chev}</span></a>`;
}
function homeCalendar(){
  const t = todayISO(), ym = S.ui.calMonth || t.slice(0, 7);
  const [y, m] = ym.split('-').map(Number);
  const first = new Date(y, m - 1, 1), days = new Date(y, m, 0).getDate(), lead = first.getDay();
  const byDate = new Map();
  for (const ev of filteredEvents()) if (ev.date.startsWith(ym)){ if (!byDate.has(ev.date)) byDate.set(ev.date, []); byDate.get(ev.date).push(ev); }
  const sel = S.ui.calDay && S.ui.calDay.startsWith(ym) ? S.ui.calDay : null;
  let g = WD.map((w, i) => `<div class="wd ${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${w}</div>`).join('');
  for (let i = 0; i < lead; i++) g += '<div class="day blank" aria-hidden="true"></div>';
  for (let d = 1; d <= days; d++){
    const iso = `${ym}-${pad2(d)}`, dow = (lead + d - 1) % 7, evs = byDate.get(iso) || [];
    const em = evs.slice(0, 2).map(evEmoji).join('') + (evs.length > 2 ? '+' : '');
    g += `<button class="day ${dow === 0 ? 'sun' : dow === 6 ? 'sat' : ''} ${iso === t ? 'today' : ''}" data-act="calDay" data-date="${iso}" ${pressed(iso === sel)}
      aria-label="${fmtDate(iso)}${evs.length ? ' 予定' + evs.length + '件' : ''}"><span class="n">${d}</span><span class="em">${em || '&nbsp;'}</span></button>`;
  }
  let html = `<div class="cal"><div class="cal-h">
      <button class="btn sm" data-act="calMove" data-v="-1" aria-label="前の月">${IC.back}</button>
      <b>${fmtYM(ym)}</b>
      <div class="row" style="gap:.35rem">${ym !== t.slice(0, 7) ? '<button class="btn sm" data-act="calMove" data-v="0">今月</button>' : ''}<button class="btn sm" data-act="calMove" data-v="1" aria-label="次の月">${IC.chev}</button></div>
    </div><div class="cal-g">${g}</div></div>`;
  if (sel){
    const evs = byDate.get(sel) || [];
    html += `<h2 class="sec">${fmtDate(sel)}</h2>` + (evs.length ? evs.map(evCard).join('') : '')
      + `<button class="btn block soft" data-act="newEvent" data-date="${sel}">${IC.plus}${fmtShort(sel)} に日程を作る</button>`;
  } else {
    const list = Array.from(byDate.values()).flat().sort((a, b) => a.date.localeCompare(b.date));
    html += hint('日付を押すと、その日の予定が出ます。何もない日を押すと、その日の日程を作れます。');
    if (list.length) html += `<h2 class="sec">${fmtYM(ym)}の予定 <small>${list.length}件</small></h2><div class="list">${list.map(pastRow).join('')}</div>`;
  }
  return html;
}

    if (needs && !(prefs.backupHideUntil && prefs.backupHideUntil > t)){
      out.push(`<div class="banner"><span class="tile t-green">${IC.save}</span><div class="grow"><b>${last ? `最後のバックアップから${days}日たちました` : 'バックアップをとっておきましょう'}</b>

        <button class="x" data-act="hideBanner" data-v="backup" aria-label="しばらく表示しない">×</button></div>`);
    }
  }
  return out.join('');
}

  html += `<div id="memberList">${memberListHTML()}</div>`;

  if (arch.length){
    html += `<button class="linkbtn" data-act="toggleArchived">${S.ui.showArchived ? '▼' : '▶'} 退会したメンバー（${arch.length}人）</button>`;
    if (S.ui.showArchived) html += `<div class="list">${arch.sort((a, b) => collator.compare(sortKey(a), sortKey(b))).map(memberRow).join('')}</div>`;
  }

}
function memberListHTML(){
  const q = toHalf(S.ui.memberQ).trim().toLowerCase(), f = S.ui.memberFilter;
  const list = activeMembers().filter(m => {
    if (q && !(m.name.toLowerCase().includes(q) || m.kana.toLowerCase().includes(q) || m.tape.toLowerCase().includes(q))) return false;
    if (f === 'fixed') return m.fixed.length > 0;
    if (f === 'unpaid') return statOf(m.id).unpaid > 0;
    if (f !== 'all') return m.fixed.includes(f);
    return true;
  }).sort((a, b) => (b.fixed.length ? 1 : 0) - (a.fixed.length ? 1 : 0) || collator.compare(sortKey(a), sortKey(b)));
  if (!activeMembers().length) return `<div class="card">${emptyBox('👥', 'まだメンバーがいません', 'LINEのメンバー名を貼り付けて、まとめて登録できます。', '<button class="btn primary" data-act="memberBulk">名前をまとめて登録</button>')}</div>`;
  if (!list.length) return `<div class="card">${emptyBox('🔍', '見つかりません', q ? `「${esc(S.ui.memberQ)}」に合う人はいません。` : '')}</div>`;
  return `<p class="small muted" style="margin:.2rem .2rem 0">${list.length}人</p><div class="list">${list.map(memberRow).join('')}</div>`;
}
function memberRow(m){
  const st = statOf(m.id), sb = [];
  const fx = m.fixed.map(id => byId(S.sports, id)).filter(s => s && !s.deletedAt);
  if (fx.length) sb.push(fx.map(s => s.emoji + '★').join(' '));
  sb.push(`参加 ${st.count}回`);
  if (st.last) sb.push(`最後 ${fmtShort(st.last)}`);
  if (m.tape && m.tape !== m.name) sb.push(`名札「${esc(m.tape)}」`);
  if (m.tier) sb.push(esc(m.tier));
  return `<button class="linkrow" data-act="memberEdit" data-mid="${m.id}"><span class="grow"><b>${m.fixed.length ? '<span class="star">★</span>' : ''}${esc(m.name)}${m.kana ? ` <span class="muted small">${esc(m.kana)}</span>` : ''}</b><small>${sb.join('・')}</small></span>
    ${st.unpaid ? `<span class="pill warn">未払い ${yen(st.unpaid)}</span>` : ''}<span class="chev">${IC.chev}</span></button>`;
}

/* ============================================================ sheets（下から出る画面）
   スタックで重ねられる（例: 人の画面 → 番号入力）。開くたびに history に1つ積むので、
   Android の戻るボタンやブラウザの戻るで、まずシートが閉じる。 */
const stack = [];
let pendingAfterClose = null;
const topSheet = () => stack[stack.length - 1] || null;
function openSheet(name, p = {}){
  stack.push({ name, p });
  try { history.pushState({ sheet: stack.length }, ''); } catch (e) {}
  renderSheet(true);
}
function closeSheet(){
  if (!stack.length) return;
  if (history.state && history.state.sheet === stack.length) history.back();
  else { stack.pop(); renderSheet(false); }
}
function closeAllThen(fn){
  const n = stack.length;
  if (!n){ if (fn) fn(); return; }
  if (history.state && history.state.sheet === n){ pendingAfterClose = fn || null; history.go(-n); }
  else { stack.length = 0; renderSheet(false); if (fn) fn(); }
}
window.addEventListener('popstate', e => {
  const depth = (e.state && e.state.sheet) || 0;
  if (stack.length > depth){ stack.length = depth; renderSheet(false); }
  if (!stack.length && pendingAfterClose){ const f = pendingAfterClose; pendingAfterClose = null; setTimeout(f, 0); }
});
function renderSheet(fresh){
  const host = $('#sheets');
  if (!stack.length){ host.innerHTML = ''; host.dataset.key = ''; document.body.classList.remove('locked'); return; }
  const top = topSheet(), def = SHEETS[top.name];
  if (!def){ stack.pop(); renderSheet(false); return; }
  const key = stack.length + ':' + top.name;
  const oldB = host.querySelector('.sheet-b');
  const keep = (!fresh && host.dataset.key === key && oldB) ? oldB.scrollTop : 0;
  const foot = def.foot ? def.foot(top.p) : '';
  const left = stack.length > 1 ? `<button class="navbtn" data-act="closeSheet">${IC.back}戻る</button>`
    : (def.cancel ? '<button class="navbtn" data-act="closeSheet">キャンセル</button>' : '');
  const right = def.done ? def.done(top.p) : '<button class="navbtn bold" data-act="closeSheet">閉じる</button>';
  host.innerHTML = `<div class="scrim ${fresh ? 'anim' : ''}" data-act="closeSheet" data-scrim="1"></div>
    <div class="sheet ${fresh ? 'anim' : ''} ${foot ? '' : 'nofoot'}" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="grab" aria-hidden="true"></div>
      <div class="sheet-h"><div class="l">${left}</div><h3 id="sheetTitle" tabindex="-1">${esc(def.title(top.p))}</h3><div class="r">${right}</div></div>
      <div class="sheet-b">${def.body(top.p)}</div>${foot ? `<div class="sheet-f">${foot}</div>` : ''}</div>`;
  host.dataset.key = key;
  if (keep) host.querySelector('.sheet-b').scrollTop = keep;
  document.body.classList.add('locked');
  if (fresh){ const h = $('#sheetTitle'); if (h) h.focus({ preventScroll: true }); }
  if (def.mount) def.mount(top.p, host, fresh);
}

        h += `<div class="blk"><div class="lbl">参加費<small>${yen(fee)}</small></div>

          ${e.feeOverride != null || p.feeOther ? `<div class="f" style="margin-bottom:.4rem"><span class="unit"><input class="inp short" inputmode="numeric" data-change="pFee" value="${esc(e.feeOverride ?? '')}" placeholder="${t.amount}" aria-label="この人の参加費" style="text-align:right">円</span>

          ${fee > 0 ? `<div class="mt">${payBig('pay', e.paid, fee)}</div>
            ${e.paid ? `<div class="f" style="margin-bottom:0"><span class="l">受け取り方</span>${seg('pMethod', e.payMethod || S.settings.defaultPayMethod, PAY_METHODS.map(x => [x, x]), 'aria-label="受け取り方"', 'block')}

          <button class="check" data-act="tape" data-mid="${p.mid}" ${pressed(e.tapeDone)}><span class="box">✓</span>作った</button></div></div>`;

      h += `<div class="blk"><div class="lbl">メモ</div><input class="inp" data-change="pMemo" value="${esc(e.memo)}" placeholder="例: 遅れて来る・早めに帰る" maxlength="200" aria-label="この日のメモ"></div>`;

            <div><div class="small muted">最後に来た日</div><b style="font-size:1.1rem">${st.last ? fmtDate(st.last) : '—'}</b></div></div>
          ${Object.keys(st.bySport).length ? `<div class="pills">${Object.entries(st.bySport).map(([sid, n]) => { const s = byId(S.sports, sid); return `<span class="pill">${s ? s.emoji + esc(s.name) : '種目なし'} ${n}回</span>`; }).join('')}</div>` : ''}</div>
          ${st.history.length ? `<div class="list">${st.history.slice(0, 8).map(({ ev, e }) => `<button class="linkrow" data-act="goEvent" data-id="${ev.id}"><span class="grow"><b>${fmtShort(ev.date)} ${evEmoji(ev)}${esc(evTitle(ev))}</b></span>${statusPill(e.status)}<span class="chev">${IC.chev}</span></button>`).join('')}</div>` : ''}
          ${ups.length ? `<p class="sh">まだもらっていないお金</p><div class="list">${ups.map(x => `<div class="item"><span class="grow"><b>${fmtShort(x.ev.date)} ${esc(evTitle(x.ev))}</b><br><span class="small muted">${x.kind === 'pay' ? '参加費' : 'ご飯代'} ${yen(x.amount)}</span></span>

  /* ---------------- 受け渡し ---------------- */
  handoff: {
    title: p => p.kind === 'return' ? '幹事に返す' : '手伝いの人に渡す',
    foot(p){
      if (p.step === 'pick') return `<button class="btn primary lg" data-act="hoMake" ${p.ids.length ? '' : 'disabled'}>メッセージを作る</button>`;
      if (!p.text) return '';

    },
    body(p){
      if (p.step === 'pick'){
        const t = todayISO();
        const evs = liveEvents().slice().sort((a, b) => (a.date >= t) === (b.date >= t) ? (a.date >= t ? a.date.localeCompare(b.date) : b.date.localeCompare(a.date)) : (a.date >= t ? -1 : 1)).slice(0, 20);
        if (!evs.length) return emptyBox('📅', '渡せる日程がありません', '先に日程を作ってください。');
        return `${hint('渡したい日程を選んでください。ふつうは1つです。')}
          <div class="list">${evs.map(ev => { const on = p.ids.includes(ev.id), s = summary(ev); return `<button class="linkrow" data-act="hoPick" data-id="${ev.id}" ${pressed(on)}>
            <span class="tile" style="background:color-mix(in srgb, ${evColor(ev)} 18%, transparent)">${evEmoji(ev)}</span>
            <span class="grow"><b>${fmtShort(ev.date)} ${esc(evTitle(ev))}</b><small>参加 ${s.yes}人${ev.dinner ? '・ご飯 ' + s.dinner + '人' : ''}</small></span>

function addPeopleList(p){
  const ev = curEv(p); if (!ev) return '';
  const q = toHalf(p.q).trim().toLowerCase(), stats = memberStats();
  const inEv = id => { const e = entryOf(ev, id); return !!(e && !e.removed); };
  const ms = activeMembers().filter(m => !q || m.name.toLowerCase().includes(q) || m.kana.toLowerCase().includes(q) || m.tape.toLowerCase().includes(q));
  const freq = m => (stats.get(m.id)?.bySport[ev.sportId]) || 0;
  const fixed = ms.filter(m => isFixed(m, ev.sportId)).sort((a, b) => collator.compare(sortKey(a), sortKey(b)));
  const regular = ms.filter(m => !isFixed(m, ev.sportId) && freq(m) > 0).sort((a, b) => freq(b) - freq(a) || collator.compare(sortKey(a), sortKey(b)));
  const others = ms.filter(m => !fixed.includes(m) && !regular.includes(m)).sort((a, b) => collator.compare(sortKey(a), sortKey(b)));
  const btn = m => { const on = inEv(m.id); return `<button class="${on ? 'on' : ''}" data-act="apAdd" data-mid="${m.id}" ${on ? 'aria-disabled="true"' : ''}><span>${on ? '✓ ' : ''}${esc(m.name)}${m.tape && m.tape !== m.name ? `<small>${esc(m.tape)}</small>` : ''}</span></button>`; };
  let h = '';
  const typed = cleanName(p.q);
  if (typed && !activeMembers().some(m => m.name === typed)) h += `<button class="btn soft block mt" data-act="apNew">${IC.plus}「${esc(typed)}」さんを新しく登録して追加</button>`;
  if (fixed.length) h += `<p class="sh">★固定メンバー</p><div class="namegrid">${fixed.map(btn).join('')}</div>`;
  if (regular.length) h += `<p class="sh">よく来る人</p><div class="namegrid">${regular.map(btn).join('')}</div>`;
  if (others.length) h += `<p class="sh">${fixed.length || regular.length ? 'ほかのメンバー' : 'メンバー'}</p><div class="namegrid">${others.map(btn).join('')}</div>`;
  if (!ms.length && !typed) h += emptyBox('👥', 'メンバーがまだいません', '上の欄に名前を入れると、新しく登録して追加できます。');
  if (!ms.length && typed && activeMembers().some(m => m.name === typed)) h += '';
  return h;
}

const stickyIds = new Set();      // しぼりこみ中に状態を変えた人は、行が消えないように残す

  $('#main').innerHTML = r === 'event' ? viewEvent() : r === 'members' ? viewMembers() : r === 'money' ? viewMoney()
    : r === 'data' ? viewData() : r === 'settings' ? viewSettings() : viewHome();

/* 入力欄の change で描き直すとき、押そうとしたボタンが消えないよう、指が離れてから描く */
let pointerDown = false, renderPending = null;
document.addEventListener('pointerdown', () => { pointerDown = true; }, true);
const releasePointer = () => { pointerDown = false; setTimeout(flushRender, 0); };
document.addEventListener('pointerup', releasePointer, true);
document.addEventListener('pointercancel', releasePointer, true);
function requestRender(scope = 'all'){
  if (renderPending !== 'all') renderPending = scope;
  if (!pointerDown) setTimeout(flushRender, 0);
}
function flushRender(){
  if (!renderPending || pointerDown) return;
  const s = renderPending; renderPending = null;
  if (s === 'view'){ renderChrome(); renderView(); } else renderAll();
}
function route(){
  if (location.hash.startsWith('#p=')){
    const code = location.hash.slice(3);
    try { history.replaceState(history.state, '', location.pathname + location.search); } catch (e) {}
    receiveCode(code);
  }
  const prevKey = S.ui.route + ':' + (S.ui.eventId || ''), prevTab = S.ui.tab;
  let h = '';
  try { h = decodeURIComponent(location.hash || ''); } catch (e) { h = ''; }
  const parts = h.replace(/^#\/?/, '').split('/').filter(Boolean);
  if (parts[0] === 'e' && parts[1]){
    S.ui.route = 'event'; S.ui.eventId = parts[1];
    S.ui.tab = ['dinner', 'money', 'tape'].includes(parts[2]) ? parts[2] : 'people';
  } else { S.ui.route = ['members', 'money', 'data', 'settings'].includes(parts[0]) ? parts[0] : 'home'; S.ui.eventId = null; }
  const key = S.ui.route + ':' + (S.ui.eventId || '');
  if (key !== prevKey){ stickyIds.clear(); S.ui.peopleFilter = 'all'; renderAll(); window.scrollTo(0, 0); }
  else {
    renderAll();
    if (S.ui.route === 'event' && prevTab !== S.ui.tab){
      const head = $('.evhead');
      if (head){ const y = head.getBoundingClientRect().bottom + window.scrollY - $('#top').offsetHeight; if (window.scrollY > y) window.scrollTo(0, y); }
    }
  }
  onScroll();
}
function onScroll(){ $('#top').classList.toggle('scrolled', window.scrollY > 30); }

/* ============================================================ toast / clipboard / share */
let toastTimer = null, toastFn = null;
function toast(msg, action){
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>${action ? `<button data-act="toastAct">${esc(action.label)}</button>` : ''}`;
  el.hidden = false; toastFn = action ? action.fn : null;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; toastFn = null; }, action ? 6000 : 2600);
}
async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove(); return ok;
}
async function shareText(text){
  if (navigator.share){ try { await navigator.share({ text }); return 'shared'; } catch (e) { if (e && e.name === 'AbortError') return 'cancel'; } }
  const ok = await copyText(text);
  if (ok) toast('コピーしました。貼り付けて送ってください');
  return ok ? 'copied' : 'fail';
}
function openLine(text){
  const a = document.createElement('a');
  a.href = 'https://line.me/R/share?text=' + encodeURIComponent(text); a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
}

function importError(e){
  const m = e && e.message;
  if (m === 'old-browser') return 'このスマホのブラウザでは受け取れませんでした。ファイルで受け渡してください';
  if (m === 'empty') return '貼り付ける内容がありません。先にメッセージをコピーしてください';

  if (m === 'too-big') return 'データが大きすぎます';

async function doImport(replace){
  const p = topSheet().p;
  if (replace && !confirm('このスマホの今のデータを消して、バックアップの内容に置き換えます。よろしいですか？')) return;
  const st = mergePkg(p.pkg, { replace });

  p.step = 'done';
  p.report = replace ? 'バックアップの内容に置き換えました' : mergeReport(st);
  p.openIds = replace ? [] : Array.from(new Set(st.newEvents.concat(st.touchedEvents))).slice(0, 5);
  if (!replace && !p.openIds.length) p.openIds = arr(p.pkg.events).map(e => e && e.id).filter(id => byId(S.events, id)).slice(0, 3);
  renderAll();
}

    renderAll(); toast('いつもの注文を入れました');
  },
  pOrderOk(){ const { ev, e } = curEntry(); if (!e) return; setEntry(ev, e, 'orders', { orderOk: !e.orderOk }); renderAll(); },
  pTier(el){
    const { p, ev, e } = curEntry(); if (!e) return;
    p.feeOther = false;
    setEntry(ev, e, 'fee', el.dataset.v ? { tierId: el.dataset.v, feeOverride: null } : { feeOverride: null });
    renderAll();
  },
  pFeeOther(){ const p = topSheet().p; p.feeOther = true; renderSheet(false); const i = $('[data-change="pFee"]'); if (i) i.focus(); },
  pMethod(el){ const { ev, e } = curEntry(); if (!e || !e.paid) return; setEntry(ev, e, 'pay', { payMethod: el.dataset.v }); renderAll(); },
  pPay(el){ const { p, ev } = curEntry(); togglePay(ev, p.mid, el.dataset.g); renderAll(); },
  pRemove(){
    const { p, ev, e } = curEntry(); if (!e) return;
    const name = nameOf(p.mid);
    setEntry(ev, e, 'removed', { removed: true }); closeSheet(); renderAll();
    toast(`${name}さんを名簿から外しました`, { label: '元に戻す', fn: () => { setEntry(ev, e, 'removed', { removed: false }); renderAll(); } });
  },

  /* ----- 番号入力 ----- */
  npKey(el){
    const p = topSheet().p, v = el.dataset.v;
    if (v === 'back') p.no = p.no.slice(0, -1);
    else if (p.no.length < 6) p.no = (p.no === '0' ? '' : p.no) + v;
    updateNumpad(p);
  },
  npText(){
    const p = topSheet().p; p.text = !p.text; if (!p.text) p.no = p.no.replace(/[^0-9]/g, '');
    renderSheet(false);
    if (p.text) setTimeout(() => { const i = $('[data-input="npText"]'); if (i) i.focus(); }, 60);
  },
  npQty(el){ const p = topSheet().p; p.qty = Math.max(1, Math.min(20, p.qty + (+el.dataset.v))); renderSheet(false); },
  npPick(el){ topSheet().p.no = el.dataset.v; ACT.npAdd(); },
  npAdd(){
    const p = topSheet().p, no = normNo(p.no); if (!no) return;
    const ev = curEv(p), e = ev && entryOf(ev, p.mid); if (!e) return;
    setEntry(ev, e, 'orders', { orders: normOrders(e.orders.concat([{ no, qty: p.qty }])), orderOk: false });
    if (e.dinner !== true) setEntry(ev, e, 'dinner', { dinner: true });
    closeSheet(); renderAll(); toast(`${no}番${p.qty > 1 ? '×' + p.qty : ''} を追加しました`);
  },

  /* ----- 文を送る ----- */
  txtCopy(){ copyText(topSheet().p.text).then(ok => toast(ok ? 'コピーしました。LINEなどに貼り付けてください' : 'コピーできませんでした。文を長押しして選んでください')); },
  txtLine(){ openLine(topSheet().p.text); },
  txtShare(){ shareText(topSheet().p.text); },
  txtReset(){ const p = topSheet().p, ev = curEv(p); if (ev){ p.text = TEXT_KINDS[p.kind].make(ev); renderSheet(false); } },
  markSent(){
    const ev = curEv(topSheet() ? topSheet().p : null); if (!ev) return;
    ev.sent = { at: nowISO(), count: dinnerPeople(ev).length, tally: tallyMap(ev) }; saveEventHeader(ev);
    closeSheet(); renderAll(); toast('「お店に伝えた」にしました');
  },

  /* ----- メンバー ----- */
  tapeSave(){
    const p = topSheet().p, m = memberOf(p.mid); if (!m) return;
    m.tape = cleanStr(p.value, 20); save('members', m); closeSheet(); renderAll(); toast('名札の名前を保存しました');
  },
  memberSave(){
    const p = topSheet().p, d = p.draft, name = cleanName(d.name);
    if (!name){ toast('名前を入れてください'); return; }
    const base = p.id ? memberOf(p.id) : null;
    if (!base && findMemberByName(name) && !confirm(`「${name}」さんはもう登録されています。同じ名前でもう1人登録しますか？`)) return;
    const m = normMember(Object.assign({}, base || {}, { id: p.id || uid(), name, kana: d.kana, tape: d.tape, fixed: d.fixed, tier: d.tier,
      usual: parseOrders(d.usualText), memo: d.memo, createdAt: base ? base.createdAt : nowISO() }));
    save('members', m); closeSheet(); renderAll(); toast(base ? '保存しました' : `${name}さんを登録しました`);
  },
  memberArchive(){
    const m = memberOf(topSheet().p.id); if (!m) return;
    m.archived = !m.archived; save('members', m); closeSheet(); renderAll(); toast(m.archived ? '退会にしました（一覧の下に移りました）' : '一覧に戻しました');
  },
  memberDelete(){
    const m = memberOf(topSheet().p.id); if (!m) return;
    if (!confirm(`${m.name}さんを削除しますか？（これまでの日程の記録は残ります）`)) return;
    m.deletedAt = nowISO(); save('members', m); closeSheet(); renderAll();
    toast(`${m.name}さんを削除しました`, { label: '元に戻す', fn: () => { m.deletedAt = null; save('members', m); renderAll(); } });
  },
  mbFixed(el){ const p = topSheet().p, id = el.dataset.v; p.fixed = p.fixed.includes(id) ? p.fixed.filter(x => x !== id) : p.fixed.concat(id); renderSheet(false); },
  mbSave(){
    const p = topSheet().p, names = parseNames(p.text);
    if (!names.length){ toast('名前を貼り付けてください'); return; }
    let added = 0, updated = 0;
    for (const n of names){
      const m = findMemberByName(n);
      if (m){
        const add = p.fixed.filter(s => !m.fixed.includes(s));
        if (add.length || m.archived){ m.fixed = m.fixed.concat(add); m.archived = false; save('members', m); updated++; }
      } else { createMember(n, { fixed: p.fixed.slice() }); added++; }
    }
    closeSheet(); renderAll(); toast(`${added}人を登録しました${updated ? `（${updated}人を更新）` : ''}`);
  },

  /* ----- お金 ----- */
  feesSave(){
    const p = topSheet().p, ev = curEv(p); if (!ev) return;
    ev.tiers = normTiers(p.draft.tiers.map(t => Object.assign({}, t, { amount: toInt(t.amount) ?? 0 }))); saveEventHeader(ev);
    closeSheet(); renderAll(); toast('参加費を保存しました');
  },
  expSave(){
    const p = topSheet().p, ev = curEv(p); if (!ev) return;
    const label = cleanStr(p.draft.label, 30), amount = toInt(p.draft.amount) ?? 0;
    if (!label && !amount){ toast('内容か金額を入れてください'); return; }
    const x = { id: p.i != null && ev.expenses[p.i] ? ev.expenses[p.i].id : uid(), label: label || '支出', amount };
    if (p.i != null && ev.expenses[p.i]) ev.expenses[p.i] = x; else ev.expenses.push(x);
    saveEventHeader(ev); closeSheet(); renderAll(); toast('支出を保存しました');
  },
  expRemove(){
    const p = topSheet().p, ev = curEv(p); if (!ev || p.i == null) return;
    ev.expenses.splice(p.i, 1); saveEventHeader(ev); closeSheet(); renderAll(); toast('支出を削除しました');
  },
  extraSave(){
    const p = topSheet().p, d = p.draft;
    if (!validDate(d.date)){ toast('日付を選んでください'); return; }
    const amount = toInt(d.amount); if (!amount){ toast('金額を入れてください'); return; }
    const base = p.id ? byId(S.extras, p.id) : null;
    const x = normExtra(Object.assign({}, base || {}, { id: p.id || uid(), date: d.date, kind: d.kind, label: d.label, amount, createdAt: base ? base.createdAt : nowISO() }));
    save('extras', x); closeSheet(); renderAll(); toast('記録しました');
  },
  extraRemove(){
    const x = byId(S.extras, topSheet().p.id); if (!x) return;
    x.deletedAt = nowISO(); save('extras', x); closeSheet(); renderAll();
    toast('削除しました', { label: '元に戻す', fn: () => { x.deletedAt = null; save('extras', x); renderAll(); } });
  },
};

/* ============================================================ inputs（data-input / data-change） */
const draftOf = () => topSheet() ? topSheet().p.draft : null;
const INPUT = {
  draft(el){ const p = topSheet() && topSheet().p; if (!p || !p.draft) return; p.draft[el.dataset.k] = el.value; if (el.dataset.k === 'date') p.dateTouched = true; },
  tier(el){ const d = draftOf(), t = d && d.tiers[+el.dataset.i]; if (t) t[el.dataset.k] = el.value; },
  exp(el){ const d = draftOf(), x = d && d.expenses[+el.dataset.i]; if (x) x[el.dataset.k] = el.value; },
  menu(el){ const d = draftOf(), x = d && d.menu[+el.dataset.i]; if (x) x[el.dataset.k] = el.value; },
  draftBulk(el){ const d = draftOf(); if (d) d.bulk = el.value; },
  wCustom(el){ if (S.ui.welcome) S.ui.welcome.custom = el.value; },
  wFee(el){ const w = S.ui.welcome; if (w && w.picks[el.dataset.k]) w.picks[el.dataset.k].fee = el.value; },
  memberQ(el){ S.ui.memberQ = el.value; const box = $('#memberList'); if (box) box.innerHTML = memberListHTML(); },
  apQ(el){ const p = topSheet().p; p.q = el.value; const box = $('#apList'); if (box) box.innerHTML = addPeopleList(p); },
  apBulk(el){ const p = topSheet().p; p.bulkText = el.value; p.bulkOpen = true; const box = $('#apBulkPrev'); if (box) box.innerHTML = bulkPreview(p); },
  mbText(el){
    const p = topSheet().p; p.text = el.value;
    const box = $('#mbPrev'); if (box) box.innerHTML = mbPreview(p);
    const b = $('#mbSaveBtn'); if (b) b.textContent = `${mbCount(p)}人を登録する`;
  },
  npText(el){ const p = topSheet().p; p.no = normNo(el.value); updateNumpad(p); },
  txt(el){ topSheet().p.text = el.value; },
  tapeVal(el){
    const p = topSheet().p; p.value = el.value;
    const prev = $('#tapePrev'); if (prev) prev.textContent = el.value.trim() || (memberOf(p.mid) ? memberOf(p.mid).name : '');
  },
};
const CHANGE = {
  dfTotal(el){ const ev = curEv(); if (!ev) return; ev.dinnerFee.total = toInt(el.value) ?? 0; saveEventHeader(ev); requestRender('view'); },
  dfFixed(el){ const ev = curEv(); if (!ev) return; ev.dinnerFee.fixed = toInt(el.value) ?? 0; saveEventHeader(ev); requestRender('view'); },
  openingBalance(el){ saveSettings({ openingBalance: toInt(el.value, -10000000, 10000000) ?? 0 }); requestRender('view'); },
  hostName(el){ saveSettings({ hostName: cleanStr(el.value, 30) }); toast('保存しました'); },
  payNote(el){ saveSettings({ payNote: cleanStr(el.value, 120) }); toast('保存しました'); },
  pNote(el){ const { ev, e } = curEntry(); if (!e) return; setEntry(ev, e, 'orders', { orderNote: cleanStr(el.value, 100) }); requestRender('view'); },
  pFee(el){ const { ev, e } = curEntry(); if (!e) return; setEntry(ev, e, 'fee', { feeOverride: toInt(el.value) }); requestRender('all'); },
  pMemo(el){ const { ev, e } = curEntry(); if (!e) return; setEntry(ev, e, 'memo', { memo: cleanStr(el.value, 200) }); requestRender('view'); },
};

/* ============================================================ boot */
function bindEvents(){
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const fn = ACT[el.dataset.act]; if (!fn) return;
    if (el.tagName === 'A') e.preventDefault();
    if (el.getAttribute('aria-disabled') === 'true') return;
    fn(el, e);
  });
  document.addEventListener('input', e => { const el = e.target, k = el.dataset && el.dataset.input; if (k && INPUT[k]) INPUT[k](el); });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.id === 'fileInput'){
      const f = el.files && el.files[0]; if (!f) return;
      if (f.size > 20000000){ toast('ファイルが大きすぎます'); return; }
      f.text().then(receiveCode).catch(() => toast('ファイルを読めませんでした'));
      return;
    }
    if (el.dataset.change && CHANGE[el.dataset.change]) CHANGE[el.dataset.change](el);
    else if (el.dataset.refresh) requestRender('all');
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && stack.length) closeSheet(); });
  window.addEventListener('hashchange', route);
  window.addEventListener('scroll', onScroll, { passive: true });
}
const withTimeout = (pr, ms) => Promise.race([pr, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
async function boot(){
  applyPrefs();
  const sp = new URLSearchParams(location.search);
  S.demo = sp.get('demo') === '1';
  let incoming = null;
  if (location.hash.startsWith('#p=')) incoming = location.hash.slice(3);
  if (incoming || sp.has('openExternalBrowser')){
    sp.delete('openExternalBrowser');
    const q = sp.toString();
    try { history.replaceState(null, '', location.pathname + (q ? '?' + q : '')); } catch (e) {}
  }
  if (history.state && history.state.sheet){ try { history.replaceState(null, ''); } catch (e) {} }
  bindEvents();
  if (S.demo) loadSample();
  else {
    /* 自己テスト（ヘッドレスの仮想時間）ではタイマーが先に進んでしまうので、待ち時間の上限を付けない */
    try { db = SELFTEST ? await openDB() : await withTimeout(openDB(), 5000); dbOK = true; await (SELFTEST ? loadAll() : withTimeout(loadAll(), 8000)); }
    catch (e){ dbOK = false; console.warn('IndexedDB unavailable', e); setTimeout(() => toast('このブラウザでは保存できません（プライベートモード？）'), 800); }
    try { if (navigator.storage && navigator.storage.persisted) S.persisted = await navigator.storage.persisted(); } catch (e) {}
  }
  route();
  if (incoming) receiveCode(incoming);
  if (!SELFTEST && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  /* 検証用フック（?selftest=… のときだけ selftest.js を読む） */
  window.KN = { S, ACT, INPUT, CHANGE, SHEETS, stack, prefs, sampleData, loadSample, normEvent, normEntry, normMember, normSport, normShop, normExtra, normSettings, normNo, normOrders,
    parseNames, parseMenu, parseOrders, toHalf, toInt, ceilTo, nextWeekday, fmtDate, fmtShort, validDate, addDays, todayISO, summary, tally, tallyMap, feeOf, dinnerFeeOf,
    sentDiff, orderNotes, mergePkg, mergeReport, buildPkg, buildBackup, encodePkg, decodeAny, pkgSummary, pkgLink, baseURL, announceText, attendText, shopText, whoText,
    unpaidText, tapeText, ledger, unpaidAll, memberStats, statOf, suggestDate, seedFixed, addPerson, makeEntry, setEntry, createMember, findMemberByName, sortedEntries,
    entryOf, openSheet, closeSheet, closeAllThen, topSheet, renderAll, renderSheet, route, saveAll, loadAll, idbAll, receiveCode, buildHandoffText, togglePay,
    get dbOK(){ return dbOK; }, get ver(){ return ver; }, savePrefs, applyPrefs };
  if (SELFTEST){ const s = document.createElement('script'); s.src = 'selftest.js?v=' + Date.now(); document.body.appendChild(s); }
}
document.addEventListener('DOMContentLoaded', boot);
</script>
